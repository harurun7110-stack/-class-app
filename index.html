<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お絵描きアプリ</title>

<style>

body{
  margin:0;
  font-family:sans-serif;
  text-align:center;
  background:#f3f3f3;
}

h1{
  margin:15px;
}

button{
  padding:10px;
  margin:4px;
  border:0;
  border-radius:10px;
  background:#4da6ff;
  color:white;
  font-size:15px;
}

#tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

canvas{
  background:white;
  border:2px solid #333;
  margin-top:10px;
  touch-action:none;
}

select,input{
  margin:5px;
  padding:5px;
}

</style>
</head>

<body>

<h1>お絵描きアプリ</h1>

<div id="tools">

<button onclick="startDraw()">書く</button>

<select id="paper">
<option value="portrait">縦</option>
<option value="landscape">横</option>
</select>

<button onclick="changeColor('black')">黒</button>
<button onclick="changeColor('red')">赤</button>
<button onclick="changeColor('blue')">青</button>

<button onclick="eraser()">消しゴム</button>

<button onclick="clearAll()">全消し</button>

<input type="range" id="penSize" min="1" max="40" value="5">

<button onclick="addText()">文字</button>

<input type="file" accept="image/*" onchange="addPhoto(event)">

<button onclick="finish()">完成</button>

</div>

<canvas id="canvas" width="350" height="500"></canvas>
<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let drawing = false;
let color = "black";


canvas.addEventListener("touchstart", start);
canvas.addEventListener("touchmove", draw);
canvas.addEventListener("touchend", stop);

canvas.addEventListener("mousedown", start);
canvas.addEventListener("mousemove", draw);
canvas.addEventListener("mouseup", stop);



function startDraw(){

  let type = document.getElementById("paper").value;

  if(type === "landscape"){
    canvas.width = 500;
    canvas.height = 350;
  }else{
    canvas.width = 350;
    canvas.height = 500;
  }

}



function start(e){

  drawing = true;
  draw(e);

}



function stop(){

  drawing = false;
  ctx.beginPath();

}



function draw(e){

  if(!drawing)return;


  let rect = canvas.getBoundingClientRect();

  let x;
  let y;


  if(e.touches){

    x = e.touches[0].clientX - rect.left;
    y = e.touches[0].clientY - rect.top;

  }else{

    x = e.clientX - rect.left;
    y = e.clientY - rect.top;

  }


  ctx.lineWidth =
  document.getElementById("penSize").value;


  ctx.lineCap="round";

  ctx.strokeStyle=color;


  ctx.lineTo(x,y);
  ctx.stroke();


  ctx.beginPath();
  ctx.moveTo(x,y);


  e.preventDefault();

}



function changeColor(c){

  color=c;

}



function eraser(){

  color="white";

}



function clearAll(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

}



function addText(){

  let t=prompt("文字を入力");

  if(t){

    ctx.font="30px sans-serif";

    ctx.fillStyle=color;

    ctx.fillText(t,50,50);

  }

}



function addPhoto(e){

  let file=e.target.files[0];

  let img=new Image();


  img.onload=function(){

    ctx.drawImage(img,0,0,200,200);

  };


  img.src=URL.createObjectURL(file);

}



function finish(){

  let a=document.createElement("a");

  a.download="作品.png";

  a.href=canvas.toDataURL();

  a.click();

}


</script>

</body>
</html>
