<div>ポイント: <span id="points">100</span></div>

<button onclick="useCode()">コード入力</button>

<div class="grid" id="shop"></div>

// ===== 固定コード100個（変化なし）=====
let codes = [

];

// ===== 表示 =====
function render(){

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">
      <b>${item.name}</b><br>
      ${item.price}pt<br>
      <button onclick="buy(${i})">購入</button>
    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 購入 =====
function buy(i){

  let item = items[i];

  if(points < item.price){
    alert("ポイント不足");
    return;
  }

  points -= item.price;

  document.getElementById("points").innerText = points;

  alert(
    "購入完了！\n\n" +
    item.name + "\n\n" +
    item.message
  );
}

// ===== コード使用（1回）=====
function useCode(){

  let input = prompt("コード入力");

  let index = codes.indexOf(input);

  if(index === -1){
    return alert("無効コード");
  }

  codes.splice(index,1);

  points += 100;

  document.getElementById("points").innerText = points;

  alert("100ポイント獲得！");
}

render();

</script>

</body>
</html>
