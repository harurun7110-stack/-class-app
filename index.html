<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お絵描きアプリ</title>

<style>

body{
  margin:0;
  background:#eeeeee;
  font-family:sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  font-size:22px;
}

#tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:#4da6ff;
  color:white;
}

#paper{
  position:relative;
  width:350px;
  height:500px;
  margin:10px auto;
  background:white;
  border:2px solid black;
  overflow:hidden;
  transform-origin:center;
}

canvas{
  position:absolute;
  left:0;
  top:0;
  width:100%;
  height:100%;
  touch-action:none;
}

.object{
  position:absolute;
  user-select:none;
  touch-action:none;
}

.selected{
  outline:2px solid #4da6ff;
}

</style>
</head>

<body>

<h1>お絵描きアプリ</h1>

<div id="tools">

<button onclick="togglePen()">ペンON/OFF</button>

<button onclick="setTool('eraser')">消しゴム</button>

<button onclick="setColor('black')">黒</button>
<button onclick="setColor('red')">赤</button>
<button onclick="setColor('blue')">青</button>

<input id="penSize" type="range" min="1" max="40" value="5">

<button onclick="addText()">文字</button>

<input type="file" accept="image/*" onchange="addImage(event)">

<button onclick="zoomPage(1.1)">画面＋</button>
<button onclick="zoomPage(0.9)">画面−</button>
<button onclick="resetPage()">戻す</button>

<button onclick="save()">完成</button>

</div>


<div id="paper">

<canvas id="canvas" width="350" height="500"></canvas>

</div>
<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const paper=document.getElementById("paper");

let penMode=false;
let tool="pen";
let color="black";

let pageZoom=1;

let drawing=false;


function togglePen(){
  penMode=!penMode;
  tool=penMode?"pen":"none";
}


function setTool(t){
  tool=t;
  penMode=true;
}


function setColor(c){
  color=c;
}



canvas.addEventListener("touchstart",startDraw);
canvas.addEventListener("touchmove",draw);
canvas.addEventListener("touchend",endDraw);


function startDraw(e){

  if(tool!=="pen" && tool!=="eraser") return;

  drawing=true;
  draw(e);

}


function draw(e){

  if(!drawing)return;


  let r=canvas.getBoundingClientRect();

  let x=e.touches[0].clientX-r.left;
  let y=e.touches[0].clientY-r.top;


  ctx.lineWidth=document.getElementById("penSize").value;

  ctx.lineCap="round";


  if(tool==="eraser"){
    ctx.strokeStyle="white";
  }else{
    ctx.strokeStyle=color;
  }


  ctx.lineTo(x,y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x,y);


  e.preventDefault();

}


function endDraw(){
  drawing=false;
  ctx.beginPath();
}



function addText(){

 let text=prompt("文字を入力");

 if(!text)return;


 let div=document.createElement("div");

 div.className="object";

 div.innerText=text;

 div.style.left="50px";
 div.style.top="50px";
 div.style.fontSize="30px";
 div.style.color=color;


 paper.appendChild(div);


 objectControl(div);

}



function addImage(e){

 let file=e.target.files[0];

 if(!file)return;


 let img=document.createElement("img");

 img.className="object";

 img.src=URL.createObjectURL(file);

 img.style.width="150px";

 img.style.left="50px";
 img.style.top="50px";


 paper.appendChild(img);


 objectControl(img);

}
let fixedObjects = new Set();


function objectControl(el){

  let startX=0;
  let startY=0;
  let startLeft=0;
  let startTop=0;

  let startDistance=0;
  let startSize=1;

  let timer;


  // タップで文字編集
  el.addEventListener("dblclick",function(){

    if(el.tagName==="DIV"){

      let newText=prompt("文字を変更",el.innerText);

      if(newText!==null){
        el.innerText=newText;
      }

    }

  });


  // 長押しで固定・解除
  el.addEventListener("touchstart",function(e){

    timer=setTimeout(()=>{

      if(fixedObjects.has(el)){

        fixedObjects.delete(el);
        el.style.opacity="1";

      }else{

        fixedObjects.add(el);
        el.style.opacity="0.6";

      }

    },700);


    if(e.touches.length===1){

      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;

      startLeft=el.offsetLeft;
      startTop=el.offsetTop;

    }


    if(e.touches.length===2){

      startDistance=getDistance(e.touches);
      startSize=parseFloat(el.dataset.size||1);

    }


  });



  el.addEventListener("touchmove",function(e){

    if(fixedObjects.has(el)) return;


    clearTimeout(timer);


    // 移動
    if(e.touches.length===1){

      let dx=e.touches[0].clientX-startX;
      let dy=e.touches[0].clientY-startY;


      el.style.left=startLeft+dx+"px";
      el.style.top=startTop+dy+"px";

    }


    // サイズ変更
    if(e.touches.length===2){

      let now=getDistance(e.touches);

      let scale=now/startDistance;

      let size=startSize*scale;


      if(size<0.3) size=0.3;
      if(size>5) size=5;


      el.style.transform="scale("+size+")";
      el.dataset.size=size;

    }


    e.preventDefault();

  });


  el.addEventListener("touchend",function(){

    clearTimeout(timer);

  });


}



function getDistance(touches){

  let x=touches[0].clientX-touches[1].clientX;
  let y=touches[0].clientY-touches[1].clientY;

  return Math.sqrt(x*x+y*y);

}



function zoomPage(num){

  pageZoom*=num;

  if(pageZoom<0.5)pageZoom=0.5;
  if(pageZoom>3)pageZoom=3;

  paper.style.transform="scale("+pageZoom+")";

}



function resetPage(){

  pageZoom=1;

  paper.style.transform="scale(1)";

}



function save(){

 let link=document.createElement("a");

 link.download="作品.png";

 link.href=canvas.toDataURL();

 link.click();

}


</script>

</body>
</html>
