<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}

#home{display:none;}

button{padding:10px;margin:5px;}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
<h2>ログイン / 登録</h2>

<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="login()">ログイン</button>

<p id="msg"></p>
</div>

<!-- ホーム -->
<div id="home">
<h2 id="user"></h2>

<button onclick="showPoint()">ポイント表示</button>
</div>

<script>

// ===== 登録 =====
function register(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  if(name === "" || pass === ""){
    document.getElementById("msg").innerText = "入力して";
    return;
  }

  localStorage.setItem("user", JSON.stringify({
    name:name,
    pass:pass,
    points:100
  }));

  document.getElementById("msg").innerText = "登録完了 +100pt";
}

// ===== ログイン =====
function login(){
  const data = JSON.parse(localStorage.getItem("user"));

  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  if(!data){
    alert("まだ登録されてない");
    return;
  }

  if(name === data.name && pass === data.pass){
    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";

    document.getElementById("user").innerText = data.name;
  } else {
    alert("ログイン失敗");
  }
}

// ===== ポイント =====
function showPoint(){
  const data = JSON.parse(localStorage.getItem("user"));
  alert("ポイント: " + (data?.points || 0));
}

</script>

</body>
</html>
