<script>


// ============================
// 基本
// ============================


const canvas=document.getElementById("canvas");

const ctx=canvas.getContext("2d");


const panel=document.getElementById("menuPanel");

const layerPanel=document.getElementById("layerPanel");

const tools=document.querySelectorAll(".tool");





// ============================
// 作品データ
// ============================


let project={


name:"新しい作品",


layers:[

{

name:"背景",

visible:true,

objects:[]

},


{

name:"レイヤー1",

visible:true,

objects:[]

}

]


};





let currentLayer=1;







// ============================
// オブジェクト種類
// ============================


// 線
// {
// type:"line",
// x1,y1,x2,y2,
// color,size,opacity,brush
// }


// 文字
// {
// type:"text",
// text,x,y,size,color
// }


// 写真
// {
// type:"image",
// img,x,y,w,h,rotate,flipX,flipY
// }


// 素材
// {
// type:"material"
// }





// ============================
// 描画エンジン
// ============================


function render(){



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);




project.layers.forEach(function(layer){



if(!layer.visible)return;





layer.objects.forEach(function(obj){



ctx.save();






// 線

if(obj.type==="line"){



ctx.globalAlpha=obj.opacity ?? 1;


ctx.strokeStyle=obj.color;


ctx.lineWidth=obj.size;


ctx.lineCap="round";


ctx.beginPath();


ctx.moveTo(obj.x1,obj.y1);


ctx.lineTo(obj.x2,obj.y2);


ctx.stroke();



}







// 文字

if(obj.type==="text"){



ctx.fillStyle=obj.color;


ctx.font=

obj.size+"px sans-serif";


ctx.fillText(

obj.text,

obj.x,

obj.y

);



}







// 写真

if(obj.type==="image"){



ctx.translate(

obj.x+obj.w/2,

obj.y+obj.h/2

);



ctx.rotate(obj.rotate||0);



ctx.scale(

obj.flipX?-1:1,

obj.flipY?-1:1

);



ctx.drawImage(

obj.img,

-obj.w/2,

-obj.h/2,

obj.w,

obj.h

);



}







// 素材

if(obj.type==="material"){



ctx.font=obj.size+"px sans-serif";


ctx.fillText(

obj.text,

obj.x,

obj.y

);



}





ctx.restore();



});



});



}





// ============================
// レイヤー表示
// ============================


function updateLayers(){



layerPanel.innerHTML=

"<h3>🗂レイヤー</h3>";



project.layers.forEach(function(layer,index){



let div=document.createElement("div");


div.className="layer";



div.innerHTML=

(index===currentLayer?"🔵 ":"")+

layer.name+

(layer.visible?"":" 🚫");




div.onclick=function(){



currentLayer=index;


updateLayers();



};




layerPanel.appendChild(div);



});



}





updateLayers();

render();





// ============================
// メニュー管理
// ============================


let openName="";



function openMenu(name,html){



if(openName===name){



panel.style.display="none";


openName="";


return;


}



openName=name;


panel.style.display="block";


panel.innerHTML=html;


}


</script>
<script>


// ============================
// ブラシ設定
// ============================


let brush={


mode:"pen",


color:"#000000",


size:10,


opacity:1,


enabled:true


};






// ============================
// 描画状態
// ============================


let drawing=false;

let last={x:0,y:0};








function canvasPoint(e){


let r=canvas.getBoundingClientRect();


return{


x:e.clientX-r.left,

y:e.clientY-r.top


};


}









function createLine(x1,y1,x2,y2){



project.layers[currentLayer].objects.push({



type:"line",


x1:x1,


y1:y1,


x2:x2,


y2:y2,


color:brush.mode==="eraser"?"white":brush.color,


size:brush.size,


opacity:brush.opacity,


brush:brush.mode



});



}





// ============================
// マウス描画
// ============================



canvas.addEventListener("mousedown",function(e){


if(!brush.enabled)return;



let p=canvasPoint(e);



drawing=true;



last=p;



});






canvas.addEventListener("mousemove",function(e){



if(!drawing)return;


if(!brush.enabled)return;



let p=canvasPoint(e);



createLine(

last.x,

last.y,

p.x,

p.y

);



last=p;


render();



});







canvas.addEventListener("mouseup",function(){



if(drawing){


saveState();


}



drawing=false;



});








// ============================
// タッチ対応
// ============================


canvas.addEventListener("touchstart",function(e){


if(!brush.enabled)return;


let t=e.touches[0];


let r=canvas.getBoundingClientRect();



last={


x:t.clientX-r.left,


y:t.clientY-r.top


};



drawing=true;


});






canvas.addEventListener("touchmove",function(e){



if(!drawing)return;



let t=e.touches[0];


let r=canvas.getBoundingClientRect();



let p={


x:t.clientX-r.left,


y:t.clientY-r.top


};




createLine(

last.x,

last.y,

p.x,

p.y

);



last=p;



render();



});





canvas.addEventListener("touchend",function(){


drawing=false;


saveState();


});









// ============================
// ペンボタン
// ============================


tools[0].onclick=function(){



openMenu("✏️ブラシ",`

<h3>✏️ブラシ</h3>


<button id="pen">

ペン

</button>


<button id="pencil">

鉛筆

</button>


<button id="water">

水彩

</button>


<button id="blur">

ぼかし

</button>


<br><br>


色

<input id="colorPick" type="color">


<br><br>


太さ

<input id="sizeRange" type="range" min="1" max="100" value="10">


<br><br>


透明度

<input id="alphaRange" type="range" min="1" max="100" value="100">


<br><br>


<button id="brushSwitch">

ON/OFF

</button>

`);





document.getElementById("pen").onclick=function(){

brush.mode="pen";

};



document.getElementById("pencil").onclick=function(){

brush.mode="pencil";

};



document.getElementById("water").onclick=function(){

brush.mode="water";

};



document.getElementById("blur").onclick=function(){

brush.mode="blur";

};





document.getElementById("colorPick").oninput=function(){

brush.color=this.value;

};





document.getElementById("sizeRange").oninput=function(){

brush.size=this.value;

};





document.getElementById("alphaRange").oninput=function(){

brush.opacity=this.value/100;

};





document.getElementById("brushSwitch").onclick=function(){

brush.enabled=!brush.enabled;

};



};









// ============================
// 消しゴム
// ============================


tools[1].onclick=function(){


brush.mode="eraser";


brush.enabled=true;



openMenu("🧽消しゴム",`

<h3>🧽消しゴム</h3>

ON

`);




};








// ============================
// スポイト
// ============================


tools[7].onclick=function(){



openMenu("💧スポイト",`

<h3>💧スポイト</h3>

キャンバスをタップして色取得

`);



canvas.onclick=function(e){


let p=canvasPoint(e);



let data=ctx.getImageData(

p.x,

p.y,

1,

1

).data;



brush.color=

"rgb("+data[0]+","+data[1]+","+data[2]+")";



};



};







</script>
<script>


// ============================
// 選択システム
// ============================


let selectedObject=null;

let selecting=false;


let dragOffset={x:0,y:0};




let transform={

scale:1,

rotate:0

};







// 選択ツール

tools[2].onclick=function(){



brush.enabled=false;



openMenu("🖐選択",`

<h3>🖐選択</h3>

<p>

文字・写真・素材をタップして選択できます

</p>

`);

};









// オブジェクト検索

function findObject(x,y){



for(let l=project.layers.length-1;l>=0;l--){



let objs=project.layers[l].objects;



for(let i=objs.length-1;i>=0;i--){



let o=objs[i];




if(o.type==="image"){


if(

x>o.x &&

x<o.x+o.w &&

y>o.y &&

y<o.y+o.h

){



return o;


}



}





if(o.type==="text"){



if(

x>o.x-20 &&

x<o.x+300 &&

y>o.y-80 &&

y<o.y+20

){



return o;


}



}





if(o.type==="material"){



if(

x>o.x-20 &&

x<o.x+100 &&

y>o.y-80 &&

y<o.y+20

){



return o;


}



}





}



}



return null;


}









// 選択枠表示

function drawSelection(){



if(!selectedObject)return;



ctx.save();


ctx.strokeStyle="#008cff";


ctx.lineWidth=3;


ctx.setLineDash([8,8]);




let o=selectedObject;



if(o.type==="image"){



ctx.strokeRect(

o.x-5,

o.y-5,

o.w+10,

o.h+10

);



}





if(o.type==="text"||o.type==="material"){



ctx.strokeRect(

o.x-10,

o.y-o.size,

200,

o.size+20

);



}



ctx.restore();



}









// 描画後に枠を追加

let oldRender=render;



render=function(){


oldRender();


drawSelection();


};









// 選択・移動

canvas.addEventListener("mousedown",function(e){



let p=canvasPoint(e);



if(!selectedObject){



selectedObject=findObject(

p.x,

p.y

);



}





if(selectedObject){



selecting=true;



dragOffset={


x:p.x-selectedObject.x,


y:p.y-selectedObject.y



};



render();



}



});








canvas.addEventListener("mousemove",function(e){



if(!selecting)return;


if(!selectedObject)return;



let p=canvasPoint(e);



selectedObject.x=

p.x-dragOffset.x;


selectedObject.y=

p.y-dragOffset.y;



render();



});








canvas.addEventListener("mouseup",function(){



if(selecting){


saveState();


}



selecting=false;



});









// ============================
// 変形ボタン
// ============================


tools[4].onclick=function(){



if(!selectedObject)return;



openMenu("🖼変形",`

<h3>🖼変形</h3>


<button id="big">

拡大

</button>


<button id="small">

縮小

</button>


<br><br>


<button id="rotate">

回転

</button>


<button id="flipX">

左右反転

</button>


<button id="flipY">

上下反転

</button>


<br><br>


<button id="deleteObj">

削除

</button>


`);






document.getElementById("big").onclick=function(){


if(selectedObject.w){


selectedObject.w*=1.1;

selectedObject.h*=1.1;


}else{


selectedObject.size*=1.1;


}


render();


};






document.getElementById("small").onclick=function(){


if(selectedObject.w){


selectedObject.w*=0.9;

selectedObject.h*=0.9;


}else{


selectedObject.size*=0.9;


}



render();



};







document.getElementById("rotate").onclick=function(){


selectedObject.rotate=

(selectedObject.rotate||0)+0.2;


render();



};








document.getElementById("flipX").onclick=function(){



selectedObject.flipX=

!selectedObject.flipX;



render();



};






document.getElementById("flipY").onclick=function(){



selectedObject.flipY=

!selectedObject.flipY;



render();



};







document.getElementById("deleteObj").onclick=function(){



project.layers[currentLayer].objects=

project.layers[currentLayer].objects.filter(

o=>o!==selectedObject

);



selectedObject=null;


render();


};



};









</script>
<script>

サイズ

<input id="editTextSize" type="range" min="10" max="200" value="${selectedObject.size}">


<br><br>


<button id="applyText">

変更

</button>


`);





document.getElementById("applyText").onclick=function(){

document.getElementById("editTextValue").value;



selectedObject.color=

document.getElementById("editTextColor").value;



selectedObject.size=

Number(document.getElementById("editTextSize").value);



render();


saveState();



};





}









// 文字ボタンから編集

tools[3].onclick=function(){



if(selectedObject && selectedObject.type==="text"){



editText();


return;


}




openMenu("🔤文字追加",`

<h3>🔤文字</h3>


<input id="newText" placeholder="文字">


<br><br>


<button id="createText">

追加

</button>


`);






document.getElementById("createText").onclick=function(){



let t=document.getElementById("newText").value;



if(!t)return;



project.layers[currentLayer].objects.push({



type:"text",


text:t,


x:200,


y:200,


size:50,


color:"#000000"



});



render();


saveState();



};



};









// ============================
// 写真追加・編集

if(selectedObject.type!=="image")return;




openMenu("🖼写真編集",`

document.getElementById("photoLarge").onclick=function(){

document.getElementById("photoSmall").onclick=function(){

// ============================
// レイヤー管理
// ============================


tools[5].onclick=function(){



openMenu("🗂レイヤー",`

<h3>🗂レイヤー</h3>


<button id="addLayer">

＋追加

</button>


<button id="copyLayer">

複製

</button>


<br><br>


<button id="upLayer">

⬆上へ

</button>


<button id="downLayer">

⬇下へ

</button>


<br><br>


<button id="renameLayer">

名前変更

</button>


`);








document.getElementById("addLayer").onclick=function(){



project.layers.push({


name:"新規レイヤー",


visible:true,


objects:[]



});


currentLayer=

project.layers.length-1;



updateLayers();


};







document.getElementById("copyLayer").onclick=function(){



let copy={



name:project.layers[currentLayer].name+" コピー",


visible:true,


objects:[...project.layers[currentLayer].objects]



};



project.layers.push(copy);


updateLayers();



};








document.getElementById("upLayer").onclick=function(){



if(currentLayer<project.layers.length-1){



let a=project.layers.splice(currentLayer,1)[0];


project.layers.splice(currentLayer+1,0,a);


currentLayer++;


updateLayers();


render();



}



};








document.getElementById("downLayer").onclick=function(){



if(currentLayer>0){



let a=project.layers.splice(currentLayer,1)[0];


project.layers.splice(currentLayer-1,0,a);


currentLayer--;


updateLayers();


render();



}



};






document.getElementById("renameLayer").onclick=function(){



let n=prompt(

"レイヤー名"

);



if(n){


project.layers[currentLayer].name=n;


updateLayers();


}



};



};



</script>
<script>


// ============================
// 定規ツール
// ============================


let rulerOn=false;



tools[6].onclick=function(){



rulerOn=!rulerOn;



openMenu("📐定規",`

<h3>📐定規</h3>


定規：

${rulerOn?"ON":"OFF"}

キャンバス上に補助線を表示します

render();

function drawRuler(){



if(!rulerOn)return;



ctx.save();



ctx.strokeStyle="#999";


ctx.setLineDash([10,10]);


ctx.beginPath();


ctx.moveTo(

100,

canvas.height/2

);


ctx.lineTo(

canvas.width-100,

canvas.height/2

);


ctx.stroke();



ctx.restore();



}







let oldRender2=render;



render=function(){


oldRender2();


drawRuler();


drawSelection();


};

<script>

x:0,

};



tools[2].onclick=function(){



handMode=true;


brush.enabled=false;

let movingCanvas=false;


let handStart=null;




canvas.addEventListener("mousedown",function(e){



if(!handMode)return;



movingCanvas=true;


handStart={


x:e.clientX,


y:e.clientY


};



});






canvas.addEventListener("mousemove",function(e){



if(!movingCanvas)return;



let dx=e.clientX-handStart.x;

let dy=e.clientY-handStart.y;



canvas.style.transform=

"translate("+dx+"px,"+dy+"px) scale("+zoom+")";



});






canvas.addEventListener("mouseup",function(){



movingCanvas=false;



});









// ============================
// ズーム
// ============================



let zoom=1;



function setZoom(){


canvas.style.transform=

"scale("+zoom+")";

}



canvas.addEventListener("wheel",function(e){



e.preventDefault();



if(e.deltaY<0){

zoom+=0.1;

}else{

zoom-=0.1;

}



if(zoom<0.5)zoom=0.5;


if(zoom>3)zoom=3;



setZoom();



});

function applyFilter(){

}
