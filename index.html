<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<style>
body { font-family: sans-serif; text-align: center; }
button { padding: 10px; margin: 5px; font-size: 16px; }

#home { display:none; }

.red { background:red; color:white; }
.blue { background:blue; color:white; }
.green { background:green; color:white; }

/* 🔶オレンジマーク */
#mark {
  margin-top: 10px;
  font-size: 40px;
  color: orange;
  font-weight: bold;
}
</style>
</head>

<body>

<div id="login">
<h2>ログイン / 登録</h2>

<input id="name" placeholder="ユーザーネーム"><br>
<input id="email" placeholder="メール"><br>
<input id="password" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>

<!-- 🔶ここが追加 -->
<div id="mark">●●●</div>

<button onclick="loginUser()">ログイン</button>

<p id="msg"></p>
</div>

<div id="home">
<h2 id="username"></h2>

<button class="red" onclick="openShop()">ショップ</button>
<button class="blue" onclick="showPoint()">ポイント</button>
<button class="green" onclick="openAdmin()">管理者</button>

<div id="content"></div>
</div>

<script>

function register(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value.trim();

  if(!name || !email || !password){
    document.getElementById("msg").innerText = "全部入力して";
    return;
  }

  localStorage.setItem("user", JSON.stringify({name, email, password}));

  document.getElementById("msg").innerText = "登録完了";
}

function loginUser(){
  const savedUser = JSON.parse(localStorage.getItem("user"));

  const name = document.getElementById("name").value.trim();
  const password = document.getElementById("password").value.trim();

  if(savedUser && name === savedUser.name && password === savedUser.password){
    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";
    document.getElementById("username").innerText=savedUser.name;
  } else {
    alert("ログイン失敗");
  }
}

function openShop(){
  document.getElementById("content").innerHTML=`
  <h3>ショップ</h3>
  <button onclick="buyItem()">情報（10pt）</button>
  `;
}

function buyItem(){
  alert("購入ありがとう！");
}

function showPoint(){
  alert("ポイント：100");
}

function openAdmin(){
  const code = prompt("コード入力");
  if(code==="582854"){
    alert("管理者OK");
  } else {
    alert("違う");
  }
}

</script>

</body>
</html>
