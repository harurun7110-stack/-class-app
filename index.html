<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Art Studio</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#202020;
font-family:sans-serif;
overflow:hidden;
}


/* アプリ全体 */

#app{

height:100vh;
display:flex;
flex-direction:column;

}



/* 上バー */

#top{

height:55px;
background:#111;
color:white;

display:flex;
align-items:center;
justify-content:space-between;

padding:0 15px;

}



.topButton{

background:#333;
color:white;

border:0;

border-radius:12px;

padding:8px;

font-size:18px;

}




/* 真ん中 */

#main{

flex:1;

display:flex;

}




/* レイヤー */

#layerBox{

width:160px;

background:#171717;

color:white;

padding:10px;

}




.layer{

background:#333;

padding:8px;

margin:5px 0;

border-radius:10px;

}




/* キャンバス */

#canvasArea{

flex:1;

background:#333;

display:flex;

align-items:center;

justify-content:center;

}



canvas{

background:white;

box-shadow:0 0 20px black;

}




/* 下メニュー */

#toolbar{

height:70px;

background:#111;

display:flex;

justify-content:center;

align-items:center;

gap:8px;

}



.tool{

width:48px;

height:48px;

border:0;

border-radius:15px;

background:#333;

color:white;

font-size:22px;

}




.tool.active{

background:#4285f4;

}





/* 設定パネル */

#panel{

position:absolute;

bottom:80px;

left:50%;

transform:translateX(-50%);

background:#111;

color:white;

padding:15px;

border-radius:20px;

min-width:220px;

display:none;

}





/* 作者 */

#author{

position:fixed;

right:8px;

bottom:4px;

font-size:10px;

color:#aaa;

}


</style>


</head>


<body>


<div id="app">



<div id="top">


<div>

🎨 Art Studio

</div>



<div>


<button class="topButton">

⭐

</button>


<button class="topButton">

⚙️

</button>


</div>



</div>






<div id="main">



<div id="layerBox">


<h3>🗂レイヤー</h3>


<div class="layer">

背景

</div>


<div class="layer">

レイヤー1

</div>



</div>







<div id="canvasArea">


<canvas id="canvas" width="900" height="550"></canvas>


</div>



</div>







<div id="toolbar">


<button class="tool">✏️</button>

<button class="tool">🧽</button>

<button class="tool">🔤</button>

<button class="tool">🖼</button>

<button class="tool">🧩</button>

<button class="tool">↩️</button>

<button class="tool">↪️</button>

<button class="tool">💾</button>


</div>



</div>




<div id="panel"></div>



<div id="author">

作者 アリーナ真面目役

</div>
<script>


const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");


const panel = document.getElementById("panel");

const tools = document.querySelectorAll(".tool");



let currentMenu="";



let drawMode="pen";

let drawing=false;


let penColor="#000000";

let penSize=8;

let opacity=1;






// メニューを1個だけ表示

function openMenu(text){


if(currentMenu===text){


panel.style.display="none";

currentMenu="";


return;


}



currentMenu=text;


panel.style.display="block";


}





// 座標取得

function getPos(e){


let r=canvas.getBoundingClientRect();


return{


x:e.clientX-r.left,

y:e.clientY-r.top


};


}







// 描画開始

canvas.addEventListener("mousedown",function(e){


drawing=true;


let p=getPos(e);


ctx.beginPath();

ctx.moveTo(p.x,p.y);


});






// 描画中

canvas.addEventListener("mousemove",function(e){


if(!drawing)return;



let p=getPos(e);



ctx.globalAlpha=opacity;


ctx.lineWidth=penSize;


ctx.lineCap="round";



if(drawMode==="eraser"){


ctx.strokeStyle="white";


}else{


ctx.strokeStyle=penColor;


}



ctx.lineTo(p.x,p.y);


ctx.stroke();


});







canvas.addEventListener("mouseup",function(){


drawing=false;


ctx.globalAlpha=1;


});







// タッチ対応

canvas.addEventListener("touchstart",function(e){


e.preventDefault();


let t=e.touches[0];


let r=canvas.getBoundingClientRect();



ctx.beginPath();


ctx.moveTo(

t.clientX-r.left,

t.clientY-r.top

);


drawing=true;



});




canvas.addEventListener("touchmove",function(e){


e.preventDefault();


if(!drawing)return;


let t=e.touches[0];

let r=canvas.getBoundingClientRect();



ctx.lineWidth=penSize;

ctx.strokeStyle=

drawMode==="eraser"

?"white"

:penColor;



ctx.lineTo(

t.clientX-r.left,

t.clientY-r.top

);


ctx.stroke();



});




canvas.addEventListener("touchend",function(){


drawing=false;


});









// ツールボタン

tools.forEach(function(btn,index){



btn.onclick=function(){



tools.forEach(b=>b.classList.remove("active"));


this.classList.add("active");





if(index===0){


drawMode="pen";


openMenu("✏️ペン");


panel.innerHTML=`

<h3>✏️ペン設定</h3>


色<br>

<input id="penColor" type="color" value="${penColor}">


<br><br>


太さ<br>

<input id="penSize" type="range" min="1" max="100" value="${penSize}">


<br><br>


透明度<br>

<input id="penOpacity" type="range" min="10" max="100" value="100">



`;





document.getElementById("penColor").oninput=function(){

penColor=this.value;

};



document.getElementById("penSize").oninput=function(){

penSize=this.value;

};



document.getElementById("penOpacity").oninput=function(){

opacity=this.value/100;

};



}






if(index===1){



drawMode="eraser";


openMenu("🧽消しゴム");


panel.innerHTML=`

<h3>🧽消しゴム</h3>

線を消せます

`;



}






if(index>=2){

openMenu(btn.innerText);

}



};



});
  // =====================
// 文字システム
// =====================


let texts=[];


let textColor="#000000";

let textSize=40;




function redrawObjects(){


ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);





// 文字表示

texts.forEach(function(t){


ctx.save();


ctx.font=t.size+"px sans-serif";

ctx.fillStyle=t.color;


ctx.fillText(

t.text,

t.x,

t.y

);


ctx.restore();



});



}








// 文字ボタン

tools[2].onclick=function(){



openMenu("🔤文字");



panel.innerHTML=`

<h3>🔤文字</h3>


<input id="txt" placeholder="文字入力">


<br><br>


色

<input id="txtColor" type="color">


<br><br>


大きさ

<input id="txtSize" type="range" min="10" max="120" value="40">


<br><br>


<button id="addTxt">

追加

</button>



`;





document.getElementById("txtColor").oninput=function(){

textColor=this.value;

};



document.getElementById("txtSize").oninput=function(){

textSize=this.value;

};





document.getElementById("addTxt").onclick=function(){


let value=document.getElementById("txt").value;



if(!value)return;



texts.push({

text:value,

x:200,

y:200,

size:textSize,

color:textColor

});



drawAll();



};





};









// =====================
// 写真システム
// =====================



let photos=[];



let selectedPhoto=null;







tools[3].onclick=function(){



openMenu("🖼写真");



panel.innerHTML=`

<h3>🖼写真</h3>


<input type="file" id="photoInput" accept="image/*">


<br><br>


<button id="photoBig">

🔍大きく

</button>


<button id="photoSmall">

🔎小さく

</button>


<br><br>


<button id="photoDelete">

🗑削除

</button>



`;







document.getElementById("photoInput").onchange=function(e){



let file=e.target.files[0];



let reader=new FileReader();



reader.onload=function(){


let img=new Image();



img.onload=function(){



let p={


img:img,

x:250,

y:150,

w:250,

h:180


};



photos.push(p);


selectedPhoto=p;


drawAll();



};



img.src=reader.result;


};



reader.readAsDataURL(file);



};







document.getElementById("photoBig").onclick=function(){


if(selectedPhoto){


selectedPhoto.w+=20;


selectedPhoto.h+=20;


drawAll();


}


};







document.getElementById("photoSmall").onclick=function(){


if(selectedPhoto){


selectedPhoto.w-=20;


selectedPhoto.h-=20;


drawAll();


}



};






document.getElementById("photoDelete").onclick=function(){



if(selectedPhoto){



photos.splice(

photos.indexOf(selectedPhoto),

1

);



selectedPhoto=null;


drawAll();



}



};






};









// =====================
// 素材
// =====================



let materials=[];



tools[4].onclick=function(){



openMenu("🧩素材");



panel.innerHTML=`

<h3>🧩素材</h3>


<button id="heart">

❤️

</button>


<button id="star">

⭐

</button>


<button id="circle">

⚪

</button>



`;




function addMaterial(x){


materials.push({

text:x,

x:300,

y:250,

size:50

});


drawAll();


}




document.getElementById("heart").onclick=function(){

addMaterial("❤️");

};



document.getElementById("star").onclick=function(){

addMaterial("⭐");

};



document.getElementById("circle").onclick=function(){

addMaterial("⚪");

};



};








// 全部描画

function drawAll(){



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);





photos.forEach(function(p){


ctx.drawImage(

p.img,

p.x,

p.y,

p.w,

p.h

);


});





texts.forEach(function(t){


ctx.font=t.size+"px sans-serif";


ctx.fillStyle=t.color;


ctx.fillText(

t.text,

t.x,

t.y

);


});





materials.forEach(function(m){



ctx.font=m.size+"px sans-serif";


ctx.fillText(

m.text,

m.x,

m.y

);



});


}
  // =====================
// レイヤー
// =====================


let layerList=[

"レイヤー1"

];





let layerBtn=document.getElementById("layerBox");



function updateLayers(){


layerBtn.innerHTML="<h3>🗂レイヤー</h3>";



layerList.forEach(function(l){



let p=document.createElement("p");


p.innerHTML="📄 "+l;


layerBtn.appendChild(p);



});



}







// =====================
// お気に入り
// =====================



let favorites=[];



document.querySelectorAll(".topButton")[0].onclick=function(){



openMenu("⭐お気に入り");



panel.innerHTML=`

<h3>⭐お気に入り</h3>


<button id="saveFav">

今の作品を登録

</button>


<div id="favList"></div>


`;






document.getElementById("saveFav").onclick=function(){



let data=canvas.toDataURL();



favorites.push(data);



let img=document.createElement("img");


img.src=data;


img.width=80;


document.getElementById("favList").appendChild(img);



localStorage.setItem(

"favorites",

JSON.stringify(favorites)

);



};



};









// =====================
// 設定
// =====================



document.querySelectorAll(".topButton")[1].onclick=function(){



openMenu("⚙️設定");



panel.innerHTML=`

<h3>⚙️設定</h3>


<p>

✏️ペン<br>

線を描く道具です

</p>


<p>

🔤文字<br>

文字を追加できます

</p>


<p>

🖼写真<br>

写真を入れて編集できます

</p>


<p>

⭐お気に入り<br>

作品を保存できます

</p>


<p>

💾保存<br>

画像として保存します

</p>


`;



};









// =====================
// 保存
// =====================



tools[7].onclick=function(){



let a=document.createElement("a");


a.download="ArtStudio.png";


a.href=canvas.toDataURL();



a.click();



};









// =====================
// 戻る・やり直し
// =====================



let history=[];


let redoHistory=[];





function saveHistory(){



history.push(

canvas.toDataURL()

);



if(history.length>30){

history.shift();

}



}





canvas.addEventListener(

"mouseup",

function(){

saveHistory();

}

);








tools[5].onclick=function(){



if(history.length>1){



redoHistory.push(

history.pop()

);



let img=new Image();



img.onload=function(){


ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);


ctx.drawImage(img,0,0);


};


img.src=

history[history.length-1];



}



};







tools[6].onclick=function(){



if(redoHistory.length){



let data=

redoHistory.pop();



let img=new Image();



img.onload=function(){


ctx.drawImage(img,0,0);


};



img.src=data;



}



};
  // =====================
// 写真移動
// =====================


let movePhoto=false;

let moveX=0;

let moveY=0;



canvas.addEventListener("mousedown",function(e){


let x=e.offsetX;

let y=e.offsetY;



photos.forEach(function(p){


if(

x>p.x &&

x<p.x+p.w &&

y>p.y &&

y<p.y+p.h

){


selectedPhoto=p;


movePhoto=true;


moveX=x-p.x;


moveY=y-p.y;


}


});


});





canvas.addEventListener("mousemove",function(e){


if(!movePhoto)return;



selectedPhoto.x=

e.offsetX-moveX;


selectedPhoto.y=

e.offsetY-moveY;



drawAll();



});





canvas.addEventListener("mouseup",function(){


movePhoto=false;


});








// =====================
// 写真回転・反転
// =====================


// 写真編集用の追加ボタンを表示


let oldPhotoOpen=tools[3].onclick;



tools[3].onclick=function(){



oldPhotoOpen();



if(panel.innerHTML.includes("🖼写真")){



panel.innerHTML+=`

<br><br>

<button id="rotate">

↻回転

</button>


<button id="flip">

↔反転

</button>


`;




document.getElementById("rotate").onclick=function(){



if(selectedPhoto){


selectedPhoto.angle=

(selectedPhoto.angle||0)+0.2;


drawAll();


}



};





document.getElementById("flip").onclick=function(){



if(selectedPhoto){


selectedPhoto.flip=

!selectedPhoto.flip;


drawAll();


}



};



}



};









// =====================
// 初期保存
// =====================



saveHistory();





// =====================
// 終了
// =====================


</script>


</body>

</html>
