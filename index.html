<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<style>
body { font-family: sans-serif; text-align: center; }
button { padding: 10px; margin: 5px; font-size: 16px; }

#home { display:none; }

.red { background:red; color:white; }
.blue { background:blue; color:white; }
.green { background:green; color:white; }
</style>
</head>

<body>

<!-- ログイン画面 -->
<div id="login">
<h2>ログイン / 登録</h2>
<input id="name" placeholder="ユーザーネーム"><br>
<input id="email" placeholder="メール"><br>
<input id="password" type="password" placeholder="パスワード"><br>
<button onclick="register()">登録</button>
<button onclick="loginUser()">ログイン</button>
<p id="msg"></p>
</div>

<!-- ホーム -->
<div id="home">
<h2 id="username"></h2>

<button class="red" onclick="openShop()">ショップ</button>
<button class="blue" onclick="showPoint()">ポイント</button>
<button class="green" onclick="openAdmin()">管理者</button>

<p id="point"></p>
<div id="content"></div>
</div>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20枠ショップ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}
.box{
  border:1px solid #ccc;
  padding:10px;
}
input{width:90%;margin:3px;}
button{margin-top:5px;}
// 登録
window.register = async () => {
  const name = nameInput.value;
  const email = emailInput.value;
  const pass = passwordInput.value;

  const user = await createUserWithEmailAndPassword(auth, email, pass);
  uid = user.user.uid;

  await setDoc(doc(db,"users",uid),{
    name:name,
    point:3000
  });

  msg.innerText="登録成功";
}

// ログイン
window.loginUser = async () => {
  const email = emailInput.value;
  const pass = passwordInput.value;

  const user = await signInWithEmailAndPassword(auth, email, pass);
  uid = user.user.uid;

  loadUser();
}

// ユーザー読み込み
async function loadUser(){
  const snap = await getDoc(doc(db,"users",uid));
  const data = snap.data();

  login.style.display="none";
  home.style.display="block";

  username.innerText = data.name;
  point.innerText = "ポイント："+data.point;
}

// ショップ
window.openShop = () => {
  content.innerHTML = `
  <h3>ショップ</h3>
  <button onclick="buyItem()">情報（10pt）</button>
  `;
}

// 購入
window.buyItem = async () => {
  const ref = doc(db,"users",uid);
  const snap = await getDoc(ref);
  let p = snap.data().point;

  if(p >= 10){
    if(confirm("購入しますか？")){
      await updateDoc(ref,{point:p-10});
      alert("購入ありがとう！");
      loadUser();
    }
  } else {
    alert("ポイント足りない");
  }
}

// ポイント表示
window.showPoint = async () => {
  const snap = await getDoc(doc(db,"users",uid));
  alert("ポイント："+snap.data().point);
}

// 管理者
window.openAdmin = () => {
  const code = prompt("コード入力");
  if(code === "582854"){
    content.innerHTML = `
    <h3>管理者</h3>
    <button onclick="addPoint()">+10ポイント</button>
    `;
  } else {
    alert("違う");
  }
}

// ポイント追加
window.addPoint = async () => {
  const ref = doc(db,"users",uid);
  const snap = await getDoc(ref);
  let p = snap.data().point;

  await updateDoc(ref,{point:p+10});
  loadUser();

<h2>ショップ（20枠）</h2>

<div>ポイント: <span id="points">3000</span></div>

<div class="grid" id="shop"></div>

<script>

let points = 100;

// ===== 20枠を最初から全部作成 =====
let items = [
  {name:"焼きそば", price:320, message:"購入ありがとう！「焼きそば」これを店員に見せよう！", active:false},
  {name:"たこ焼き", price:250, message:"購入ありがとう！「たこ焼き」これを店員に見せよう！", active:false},
  {name:"きゅうり", price:120, message:"購入ありがとう！「きゅうり」これを店員に見せよう！", active:false},
  {name:"ポテト", price:200, message:" 購入ありがとう！「ポテト」これを店員に見せよう！", active:false},
  {name:"唐揚げ", price:230, message:"購入ありがとう！「唐揚げ」これを店員に見せよう！", active:false},

  {name:ポックンミョン", price:280, message:"購入ありがとう！「ポックンミョン」これを店員に見せよう！", active:false},
  {name:"おにぎり", price:150, message:"購入ありがとう！「おにぎり」これを店員に見せよう！", active:false},
  {name:"ぐるぐるポテト", price:180, message:"購入ありがとう！「ぐるぐるポテト」これを店員に見せよう！", active:false},
  {name:"射的", price:120, message:"購入ありがとう！「射的」これを店員に見せよう！", active:false},
  {name:"くじ引き", price:150, message:"購入ありがとう！「くじ引き」これを店員に見せよう！", active:false},

  {name:"魚釣り", price:130, message:"購入ありがとう！「魚釣り」これを店員に見せよう！", active:false},
  {name:"ビンゴ", price:160, message:"購入ありがとう！「ビンゴ」これを店員に見せよう！", active:false},
  {name:"テレビ使用権小", price:100, message:"購入ありがとう！「テレビ使用権小」これを店員に見せよう！", active:false},
  {name:"テレビ使用権中", price:200, message:"購入ありがとう！「テレビ使用権中」これを店員に見せよう！", active:false},
  {name:"テレビ使用権大", price:500, message:"購入ありがとう！「テレビ使用権大」これを店員に見せよう！", active:false},

  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false}
];

// ===== 表示 =====
function render(){

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">

      <input value="${item.name}"
      onchange="items[${i}].name=this.value">

      <input type="number" value="${item.price}"
      onchange="items[${i}].price=Number(this.value)">

      <input value="${item.message}"
      onchange="items[${i}].message=this.value">

      <br>

      <button onclick="activate(${i})">有効化</button>
      <button onclick="buy(${i})">購入</button>

    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 枠を有効化（商品追加扱い）=====
function activate(i){

  if(items[i].active){
    alert("もう登録済み");
    return;
  }

  let name = items[i].name;
  let price = items[i].price;
  let message = items[i].message;

  if(name==="商品なし"){
    name = prompt("商品名");
    price = prompt("値段");
    message = prompt("メッセージ");
  }

  items[i] = {
    name,
    price:Number(price),
    message,
    active:true
  };

  alert("登録完了");
  render();
}

// ===== 購入 =====
function buy(i){

  let item = items[i];

  if(!item.active){
    alert("未登録商品です");
    return;
  }

  if(points < item.price){
    alert("ポイント不足");
    return;
  }

  points -= item.price;

  document.getElementById("points").innerText = points;

  alert(
    "購入完了！\n\n" +
    item.name + "\n\n" +
    item.message
  );
}

// 初期表示
render();

</script>

</body>
</html>
