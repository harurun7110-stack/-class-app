<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスショップ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}
#home{display:none;}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}
.box{
  border:1px solid #ccc;
  padding:10px;
}
button{margin:5px;}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
<h2>登録 / ログイン</h2>

<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="login()">ログイン</button>

<p id="msg"></p>
</div>

<!-- ホーム -->
<div id="home">

<h3 id="user"></h3>

<div>ポイント: <span id="points">100</span></div>

<button onclick="adminLogin()">管理者</button>

<div class="grid" id="shop"></div>

</div>

<script>

let currentUser = null;
let isAdmin = false;
let points = 100;

// ===== 20枠（完全固定）=====
let items = [
  {name:"かのあのTikTok", price:50, message:"k514915", active:true},
  {name:"板谷りんかのTikTok", price:40, message:"rinka75431", active:true},
  {name:"あやののTikTok", price:40, message:"taaaaaaaiyakl", active:true},
  {name:"ねねのTikTok", price:40, message:"n4_e2ne1", active:true},
  {name:"亀谷りなが告った人", price:60, message:"豊田こうすけ、振られた", active:true},

  {name:"太田いつきの元と現好きな人", price:50, message:"元山本ひなた 現豊田こうすけ", active:true},

  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},

  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},

  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false}
];

// ===== 登録 =====
function register(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  if(!name || !pass){
    alert("入力して");
    return;
  }

  localStorage.setItem(name, pass);

  alert("登録完了");
}

// ===== ログイン =====
function login(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  const saved = localStorage.getItem(name);

  if(saved !== pass){
    alert("ログイン失敗");
    return;
  }

  currentUser = name;

  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";

  document.getElementById("user").innerText=name;

  render();
}

// ===== 管理者 =====
function adminLogin(){

  const code = prompt("管理者コード");

  if(code==="582854"){
    isAdmin = true;
    alert("管理者ON");
  } else {
    alert("違う");
  }
}

// ===== ショップ表示 =====
function render(){

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">

      <b>${item.name}</b><br>
      ${item.price}pt<br>

      <button onclick="buy(${i})">購入</button>

    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 購入 =====
function buy(i){

  const item = items[i];

  if(!item.active){
    alert("未登録商品");
    return;
  }

  if(points < item.price){
    alert("ポイント不足");
    return;
  }

  points -= item.price;

  document.getElementById("points").innerText = points;

  alert(
    "購入完了！\n\n" +
    item.name + "\n\n" +
    "💬 " + item.message
  );
}

</script>

</body>
</html>
