<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お絵描きアプリ</title>

<style>

body{
 margin:0;
 background:#eee;
 font-family:sans-serif;
 text-align:center;
 overflow:hidden;
}

#tools{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:5px;
}

button{
 padding:8px;
 border:0;
 border-radius:10px;
 background:#4da6ff;
 color:white;
}

#paper{
 width:350px;
 height:500px;
 background:white;
 border:2px solid black;
 margin:10px auto;
 position:relative;
 overflow:hidden;
}

canvas{
 position:absolute;
 left:0;
 top:0;
 width:100%;
 height:100%;
 touch-action:none;
}

.object{
 position:absolute;
 user-select:none;
 touch-action:none;
 white-space:nowrap;
}

</style>
</head>

<body>

<h1>お絵描きアプリ</h1>

<div id="tools">

<button onclick="togglePen()">ペンON/OFF</button>

<button onclick="changeMode('eraser')">消しゴム</button>

<button onclick="changeColor('black')">黒</button>
<button onclick="changeColor('red')">赤</button>
<button onclick="changeColor('blue')">青</button>

<input id="penSize" type="range" min="1" max="40" value="5">


<button onclick="createText()">文字</button>

<input type="file" accept="image/*" onchange="createPhoto(event)">


<button onclick="zoomScreen(1.1)">画面＋</button>
<button onclick="zoomScreen(0.9)">画面−</button>

<button onclick="resetScreen()">戻す</button>


<button onclick="saveImage()">完成</button>


</div>


<div id="paper">

<canvas id="canvas" width="350" height="500"></canvas>

</div>
<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const paper=document.getElementById("paper");


let mode="none";
let color="black";
let pen=false;

let zoom=1;
let drawing=false;



function togglePen(){

 pen=!pen;

 mode=pen?"pen":"none";

}



function changeMode(m){

 mode=m;

}



function changeColor(c){

 color=c;

}



// ペン

canvas.addEventListener("touchstart",e=>{

 if(mode!=="pen" && mode!=="eraser")return;

 drawing=true;

 draw(e);

});


canvas.addEventListener("touchmove",draw);


canvas.addEventListener("touchend",()=>{

 drawing=false;

 ctx.beginPath();

});



function draw(e){

 if(!drawing)return;


 let r=canvas.getBoundingClientRect();

 let x=e.touches[0].clientX-r.left;

 let y=e.touches[0].clientY-r.top;


 ctx.lineWidth=document.getElementById("penSize").value;

 ctx.lineCap="round";


 ctx.strokeStyle=
 mode==="eraser"?"white":color;


 ctx.lineTo(x,y);

 ctx.stroke();


 ctx.beginPath();

 ctx.moveTo(x,y);

 e.preventDefault();

}



// 文字

function createText(){

 let text=prompt("文字を入力");


 if(!text)return;


 let div=document.createElement("div");


 div.className="object";


 div.innerText=text;


 div.style.fontSize="30px";

 div.style.color=color;


 div.style.left="20px";

 div.style.top="20px";


 paper.appendChild(div);


 control(div);

}



// 写真

function createPhoto(e){

 let file=e.target.files[0];

 if(!file)return;


 let img=document.createElement("img");


 img.className="object";


 img.src=URL.createObjectURL(file);


 img.style.width="150px";


 img.style.left="20px";

 img.style.top="20px";


 paper.appendChild(img);


 control(img);

}
 function control(el){

 let fixed=false;
 let timer;

 let startX,startY;
 let startLeft,startTop;

 let startDistance=0;
 let scale=1;



 el.addEventListener("touchstart",e=>{


  timer=setTimeout(()=>{

   fixed=!fixed;

   el.style.opacity=fixed?"0.5":"1";

  },700);



  if(e.touches.length===1){

   startX=e.touches[0].clientX;
   startY=e.touches[0].clientY;

   startLeft=el.offsetLeft;
   startTop=el.offsetTop;

  }


  if(e.touches.length===2){

   startDistance=getDistance(e.touches);

  }


 });



 el.addEventListener("touchmove",e=>{


  if(fixed)return;


  clearTimeout(timer);



  if(e.touches.length===1){

   let x=startLeft+
   e.touches[0].clientX-startX;


   let y=startTop+
   e.touches[0].clientY-startY;


   // 紙から出ない

   x=Math.max(0,
    Math.min(x,paper.clientWidth-el.offsetWidth));


   y=Math.max(0,
    Math.min(y,paper.clientHeight-el.offsetHeight));


   el.style.left=x+"px";

   el.style.top=y+"px";


  }



  if(e.touches.length===2){

   let now=getDistance(e.touches);


   scale*=now/startDistance;


   if(scale<0.3)scale=0.3;

   if(scale>4)scale=4;


   el.style.transform=
   "scale("+scale+")";


   startDistance=now;

  }


  e.preventDefault();

 });


 el.addEventListener("touchend",()=>{

  clearTimeout(timer);

 });


 // 文字をタップして編集

 el.addEventListener("click",()=>{

  if(el.tagName==="DIV"){

   let n=prompt("文字を変更",el.innerText);


   if(n!==null){

    el.innerText=n;

   }

  }

 });


}



function getDistance(t){

 let x=t[0].clientX-t[1].clientX;

 let y=t[0].clientY-t[1].clientY;


 return Math.sqrt(x*x+y*y);

}



// 画面ズーム

function zoomScreen(v){

 zoom*=v;

 if(zoom<0.5)zoom=0.5;

 if(zoom>3)zoom=3;


 paper.style.transform=
 "scale("+zoom+")";

}



function resetScreen(){

 zoom=1;

 paper.style.transform="scale(1)";

}



// 保存

function saveImage(){

 let a=document.createElement("a");

 a.download="作品.png";

 a.href=canvas.toDataURL();

 a.click();

}


</script>

</body>
</html>
