<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>20枠ショップ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}
.box{
  border:1px solid #ccc;
  padding:10px;
}
input{width:90%;margin:3px;}
button{margin-top:5px;}
</style>
</head>

<body>

<h2>ショップ（20枠）</h2>

<div>ポイント: <span id="points">100</span></div>

<div class="grid" id="shop"></div>

<script>

let points = 100;

// ===== 20枠を最初から全部作成 =====
let items = [
  {name:"かのあのTiktok", price:50, message:"k514915", active:false},
  {name:"板谷りんかのTiktok", price:40, message:"rinka75431", active:false},
  {name:"あやののTiktok", price:40, message:"taaaaaaaiyakl", active:false},
  {name:"ねねのTiktok", price:40, message:" n4_e2ne1", active:false},
  {name:"亀谷りなが告った人", price:60, message:"豊田こうすけ、振られた", active:false},

  {name:太田いつきの元と現好きな人", price:50, message:"元山本ひなた現豊田こうすけ", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},

  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},

  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false},
  {name:"商品なし", price:0, message:"メッセージなし", active:false}
];

// ===== 表示 =====
function render(){

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">

      <input value="${item.name}"
      onchange="items[${i}].name=this.value">

      <input type="number" value="${item.price}"
      onchange="items[${i}].price=Number(this.value)">

      <input value="${item.message}"
      onchange="items[${i}].message=this.value">

      <br>

      <button onclick="activate(${i})">有効化</button>
      <button onclick="buy(${i})">購入</button>

    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 枠を有効化（商品追加扱い）=====
function activate(i){

  if(items[i].active){
    alert("もう登録済み");
    return;
  }

  let name = items[i].name;
  let price = items[i].price;
  let message = items[i].message;

  if(name==="商品なし"){
    name = prompt("商品名");
    price = prompt("値段");
    message = prompt("メッセージ");
  }

  items[i] = {
    name,
    price:Number(price),
    message,
    active:true
  };

  alert("登録完了");
  render();
}

// ===== 購入 =====
function buy(i){

  let item = items[i];

  if(!item.active){
    alert("未登録商品です");
    return;
  }

  if(points < item.price){
    alert("ポイント不足");
    return;
  }

  points -= item.price;

  document.getElementById("points").innerText = points;

  alert(
    "購入完了！\n\n" +
    item.name + "\n\n" +
    item.message
  );
}

// 初期表示
render();

</script>

</body>
</html>
