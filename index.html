<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{font-family:sans-serif;margin:0;text-align:center;}
#home{display:none;}
button{padding:10px;margin:5px;}
.item{border:1px solid #ccc;margin:5px;padding:10px;}
.shopGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
<h2>ログイン / 登録</h2>

<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="login()">ログイン</button>

<p id="msg"></p>
</div>

<!-- ホーム -->
<div id="home">

<h3 id="user"></h3>
<div>ポイント: <span id="points">0</span></div>

<button onclick="openShop()">ショップ</button>
<button onclick="admin()">管理者</button>

<div id="content"></div>

</div>

<script>

// ===== Firebase =====
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = null;
let isAdmin = false;
let points = 0;
let products = [];

// ===== 登録 =====
function register(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  db.collection("users").doc(name).set({
    name,
    pass,
    points:100
  });

  msg.innerText="登録完了 +100pt";
}

// ===== ログイン =====
function login(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  db.collection("users").doc(name).get().then(doc=>{
    if(!doc.exists){
      alert("登録されてない");
      return;
    }

    const data = doc.data();

    if(data.pass !== pass){
      alert("パスワード違う");
      return;
    }

    currentUser = name;
    points = data.points || 0;

    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";

    document.getElementById("user").innerText=name;
    document.getElementById("points").innerText=points;

    loadProducts();
    renderShop();
  });
}

// ===== 管理者 =====
function admin(){
  const code = prompt("コード");

  if(code==="582854"){
    isAdmin = true;
    alert("管理者ON");
  } else {
    alert("違う");
  }
}

// ===== 商品取得 =====
function loadProducts(){
  db.collection("products").onSnapshot(snap=>{
    products=[];
    snap.forEach(d=>{
      products.push({id:d.id,...d.data()});
    });
    renderShop();
  });
}

// ===== ショップ =====
function openShop(){
  renderShop();
}

function renderShop(){
  let html="<h3>ショップ</h3><div class='shopGrid'>";

  products.forEach(p=>{
    html+=`
    <div class="item">
      <b>${p.name}</b><br>
      ${p.price}pt<br>

      <button onclick="buy('${p.id}',${p.price},'${p.owner}')">
        購入
      </button>
    </div>
    `;
  });

  if(isAdmin){
    html+=`<button onclick="addProduct()">商品追加</button>`;
  }

  html+="</div>";
  content.innerHTML=html;
}

// ===== 商品追加（メッセージ付き）=====
function addProduct(){
  const name = prompt("商品名");
  const price = prompt("値段");
  const message = prompt("購入者へのメッセージ");

  db.collection("products").add({
    name,
    price:Number(price),
    message,
    owner:currentUser
  });
}

// ===== 購入（ポイント＋メッセージ）=====
function buy(id,price,owner){

  if(points < price){
    alert("ポイントが足りません");
    return;
  }

  const ok = confirm("購入しますか？");
  if(!ok) return;

  points -= price;

  db.collection("users").doc(currentUser).update({
    points: points
  });

  // 出品者にポイント
  if(owner){
    db.collection("users").doc(owner).get().then(doc=>{
      if(doc.exists){
        db.collection("users").doc(owner).update({
          points: (doc.data().points || 0) + price
        });
      }
    });
  }

  // ⭐ 出品者メッセージ表示
  db.collection("products").doc(id).get().then(doc=>{
    if(doc.exists){
      const data = doc.data();
      alert("購入完了！\n\n出品者メッセージ：\n" + (data.message || "なし"));
    }
  });

  document.getElementById("points").innerText = points;
}

</script>

</body>
</html>
