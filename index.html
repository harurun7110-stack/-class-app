<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Canva風 新聞・チラシメーカー</title>


<style>

body{

margin:0;

font-family:sans-serif;

background:#eee;

}


#app{

display:flex;

height:90vh;

}



/* 左メニュー */

#sidebar{

width:180px;

background:white;

padding:10px;

border-right:1px solid #ccc;

}


.menuButton{

width:100%;

height:45px;

margin:5px 0;

border:none;

border-radius:12px;

background:#eee;

font-size:16px;

}



.menuButton:active{

background:#ddd;

}





/* 作業エリア */

#workspace{

flex:1;

display:flex;

justify-content:center;

align-items:center;

position:relative;

}





/* キャンバス */

#paper{

width:700px;

height:450px;

background:white;

box-shadow:0 5px 20px #999;

position:relative;

}





/* お気に入り */

#favorite{

position:absolute;

right:20px;

top:20px;

background:white;

padding:12px;

border-radius:15px;

box-shadow:0 3px 10px #aaa;

}





/* 作者 */

#author{

height:10vh;

background:white;

display:flex;

align-items:center;

justify-content:center;

font-size:18px;

</style>


</head>



<body>


<div id="app">



<aside id="sidebar">


<h2>編集</h2>


<button class="menuButton">
✏️ 描く
</button>


<button class="menuButton">
🔤 文字
</button>


<button class="menuButton">
🖼 写真
</button>


<button class="menuButton">
📄 紙
</button>


<button class="menuButton">
🧩 素材
</button>


<button class="menuButton">
✂️ 編集
</button>


<button class="menuButton">
💾 保存
</button>


</aside>




<main id="workspace">


<div id="favorite">

⭐ お気に入り

</div>



<div id="paper">

</div>



</main>


</div>



<div id="author">

作者　アリーナ真面目役

</div>
<script>


// キャンバス作成

const paper =
document.getElementById("paper");


const canvas =
document.createElement("canvas");


canvas.width=700;

canvas.height=450;


paper.appendChild(canvas);



const ctx =
canvas.getContext("2d");




// ペン設定

let penColor="black";

let penSize=5;

let drawing=false;




// 描き始め

canvas.addEventListener(
"mousedown",
function(e){


drawing=true;


ctx.beginPath();


ctx.moveTo(

e.offsetX,

e.offsetY

);


});




// 描く

canvas.addEventListener(
"mousemove",
function(e){


if(!drawing)return;



ctx.lineWidth=penSize;

ctx.lineCap="round";

ctx.strokeStyle=penColor;



ctx.lineTo(

e.offsetX,

e.offsetY

);



ctx.stroke();



});





// 終了

canvas.addEventListener(
"mouseup",
function(){


drawing=false;


});



</script>
<style>

#drawPanel{

position:absolute;

left:200px;

top:20px;

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 3px 10px #aaa;

display:none;

}


</style>



<div id="drawPanel">

<h3>✏️ 描く</h3>


色

<input type="color" id="penColor">



<br><br>


太さ

<input 
type="range"
id="penSize"
min="1"
max="40"
value="5"
>



<br><br>


<button id="eraserButton">

消しゴム

</button>



<button id="penButton">

ペン

</button>


</div>




<script>


let eraser=false;



// 描くボタン

document.querySelectorAll(".menuButton")[0]
.onclick=function(){


document.getElementById("drawPanel")
.style.display="block";


};





// 色変更

document.getElementById("penColor")
.oninput=function(){


penColor=this.value;

eraser=false;


};






// 太さ変更

document.getElementById("penSize")
.oninput=function(){


penSize=this.value;


};






// 消しゴム

document.getElementById("eraserButton")
.onclick=function(){


eraser=true;

penColor="white";


};






// ペンに戻す

document.getElementById("penButton")
.onclick=function(){


eraser=false;

penColor=
document.getElementById("penColor").value;


};



</script>
<style>

#textPanel{

position:absolute;

left:200px;

top:180px;

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 3px10px #aaa;

display:none;

}


</style>




<div id="textPanel">


<h3>🔤 文字</h3>


<input 
id="textInput"
placeholder="文字を入力">



<br><br>



<button id="addTextButton">

追加

</button>



</div>





<script>


let textObjects=[];





// 文字ボタン

document.querySelectorAll(".menuButton")[1]
.onclick=function(){


document.getElementById("textPanel")
.style.display="block";


};






// 文字追加

document.getElementById("addTextButton")
.onclick=function(){



let text=

document.getElementById("textInput").value;



if(text=="")return;





textObjects.push({


text:text,

x:100,

y:100,

size:30,

color:"black"


});





drawAll();



};







// 全部描画

function drawAll(){



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);






// 文字

textObjects.forEach(function(obj){



ctx.font=

obj.size+"px sans-serif";



ctx.fillStyle=

obj.color;



ctx.fillText(

obj.text,

obj.x,

obj.y

);



});



}



</script>
<script>


let selectedText=null;

let textMoveX=0;

let textMoveY=0;





// 文字を選択

canvas.addEventListener(

"mousedown",

function(e){


let x=e.offsetX;

let y=e.offsetY;



for(

let i=textObjects.length-1;

i>=0;

i--

){


let obj=textObjects[i];



if(

x>=obj.x &&

x<=obj.x+300 &&

y<=obj.y &&

y>=obj.y-obj.size

){


selectedText=obj;



textMoveX=

x-obj.x;



textMoveY=

y-obj.y;



break;


}



}



});






// 移動

canvas.addEventListener(

"mousemove",

function(e){



if(selectedText==null)return;



selectedText.x=

e.offsetX-textMoveX;



selectedText.y=

e.offsetY-textMoveY;



drawAll();



});






// 離す

canvas.addEventListener(

"mouseup",

function(){


selectedText=null;


});



</script>
<style>

#textEditPanel{

position:absolute;

left:200px;

top:350px;

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 3px 10px #aaa;

display:none;

}


</style>




<div id="textEditPanel">


<h3>✂️ 文字編集</h3>


<button id="textUp">

🔼 大きく

</button>



<button id="textDown">

🔽 小さく

</button>


<br><br>


<input 
type="color"
id="textColorPicker">


<br><br>


<button id="deleteText">

🗑 削除

</button>



</div>






<script>


// 編集ボタン

document.querySelectorAll(".menuButton")[5]
.onclick=function(){


document.getElementById("textEditPanel")
.style.display="block";


};






// 大きく

document.getElementById("textUp")
.onclick=function(){


if(selectedText){


selectedText.size+=5;


drawAll();


}


};






// 小さく

document.getElementById("textDown")
.onclick=function(){


if(selectedText && selectedText.size>10){


selectedText.size-=5;


drawAll();


}


};






// 色変更

document.getElementById("textColorPicker")
.oninput=function(){


if(selectedText){


selectedText.color=this.value;


drawAll();


}


};






// 削除

document.getElementById("deleteText")
.onclick=function(){


if(selectedText){



let i=

textObjects.indexOf(selectedText);



if(i!=-1){


textObjects.splice(i,1);


}



selectedText=null;


drawAll();


}


};



</script>
<style>

#photoPanel{

position:absolute;

right:20px;

top:80px;

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 3px10px #aaa;

display:none;

}


</style>




<div id="photoPanel">


<h3>🖼 写真</h3>


<input 
type="file"
id="photoInput"
accept="image/*">



</div>





<script>


let photos=[];





// 写真ボタン

document.querySelectorAll(".menuButton")[2]
.onclick=function(){


document.getElementById("photoPanel")
.style.display="block";


};






// 写真追加

document.getElementById("photoInput")
.onchange=function(e){



let file=e.target.files[0];



if(!file)return;





let reader=new FileReader();





reader.onload=function(){



let img=new Image();



img.src=reader.result;



img.onload=function(){



photos.push({


image:img,

x:150,

y:150,

width:200,

height:150


});



drawAllPhotos();



};



};



reader.readAsDataURL(file);



};






// 写真描画

function drawAllPhotos(){



photos.forEach(function(obj){



ctx.drawImage(

obj.image,

obj.x,

obj.y,

obj.width,

obj.height

);



});



}



</script>
<script>


let selectedPhoto=null;


let photoMoveX=0;

let photoMoveY=0;






// 写真選択

canvas.addEventListener(

"mousedown",

function(e){


let x=e.offsetX;

let y=e.offsetY;




for(

let i=photos.length-1;

i>=0;

i--

){



let obj=photos[i];



if(

x>=obj.x &&

x<=obj.x+obj.width &&

y>=obj.y &&

y<=obj.y+obj.height

){



selectedPhoto=obj;



photoMoveX=

x-obj.x;



photoMoveY=

y-obj.y;



break;



}



}



});







// 写真移動

canvas.addEventListener(

"mousemove",

function(e){



if(selectedPhoto==null)return;




selectedPhoto.x=

e.offsetX-photoMoveX;



selectedPhoto.y=

e.offsetY-photoMoveY;



drawAllPhotos();



});







// 離す

canvas.addEventListener(

"mouseup",

function(){


selectedPhoto=null;


});




</script>
<style>

#paperPanel{

position:absolute;

right:20px;

top:250px;

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 3px 10px #aaa;

display:none;

}



#materialPanel{

position:absolute;

right:20px;

top:400px;

background:white;

padding:15px;

border-radius:15px;

box-shadow:0 3px 10px #aaa;

display:none;

}


</style>





<div id="paperPanel">


<h3>📄 紙</h3>


<input 
type="color"
id="paperColor">



</div>






<div id="materialPanel">


<h3>🧩 素材</h3>


<button id="squareButton">

⬜ 四角

</button>



<button id="starButton">

⭐ 星

</button>



</div>






<script>


let materials=[];



// 紙ボタン

document.querySelectorAll(".menuButton")[3]
.onclick=function(){


document.getElementById("paperPanel")
.style.display="block";


};






// 背景変更

document.getElementById("paperColor")
.oninput=function(){


document.getElementById("paper")
.style.background=this.value;


};








// 素材ボタン

document.querySelectorAll(".menuButton")[4]
.onclick=function(){


document.getElementById("materialPanel")
.style.display="block";


};






// 四角

document.getElementById("squareButton")
.onclick=function(){


materials.push({


type:"square",

x:250,

y:150,

size:80


});


drawMaterials();


};







// 星

document.getElementById("starButton")
.onclick=function(){


materials.push({


type:"star",

x:300,

y:200

});


drawMaterials();


};







// 素材描画

function drawMaterials(){



materials.forEach(function(obj){



if(obj.type=="square"){



ctx.fillStyle="orange";


ctx.fillRect(

obj.x,

obj.y,

obj.size,

obj.size

);



}



if(obj.type=="star"){



ctx.font="60px sans-serif";


ctx.fillText(

"⭐",

obj.x,

obj.y

);



}



});



}



</script>
<script>


let favorites=[];



// お気に入りエリア

const favoriteBox =
document.getElementById("favorite");




// キャンバス保存

function saveImage(){


let link=document.createElement("a");


link.download="design.png";


link.href=canvas.toDataURL();


link.click();


}





// 保存ボタン

document.querySelectorAll(".menuButton")[6]
.onclick=function(){


saveImage();


};






// キャンバスをお気に入り登録

favoriteBox.onclick=function(){



let img=

canvas.toDataURL();




favorites.push(img);



showFavorites();



};






// 表示

function showFavorites(){



favoriteBox.innerHTML=

"⭐ お気に入り<br>";



favorites.forEach(function(img,index){



let p=document.createElement("img");


p.src=img;


p.width=80;


p.style.margin="5px";



favoriteBox.appendChild(p);



});



}




</script>
<style>

/* キャンバスをきれいに表示 */

canvas{

display:block;

}



/* ボタン見た目調整 */

button{

cursor:pointer;

}



/* パネル文字 */

h3{

margin-top:0;

}



</style>
