<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かきノート</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:sans-serif;
}

body{
    background:#ececec;
}

#home{
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

h1{
    margin-bottom:40px;
    font-size:42px;
}

button{
    border:none;
    border-radius:18px;
    padding:18px 35px;
    font-size:24px;
    cursor:pointer;
}

#writeBtn{
    background:#4caf50;
    color:white;
}

#paperMenu{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    justify-content:center;
    align-items:center;
}

.menu{
    background:white;
    padding:25px;
    border-radius:20px;
    width:300px;
}

.menu h2{
    text-align:center;
    margin-bottom:20px;
}

.paperBtn{
    width:100%;
    margin-top:10px;
    background:#2196f3;
    color:white;
}

#paper{
    display:none;
    background:white;
    margin:20px auto;
    border:2px solid #aaa;
}

.vertical{
    width:320px;
    height:550px;
}

.horizontal{
    width:550px;
    height:320px;
}
</style>

</head>
<body>

<div id="home">
<h1>かきノート</h1>

<button id="writeBtn">
書く
</button>

</div>

<div id="paperMenu">

<div class="menu">

<h2>紙を選ぶ</h2>

<button class="paperBtn" onclick="createPaper('vertical')">
縦
</button>

<button class="paperBtn" onclick="createPaper('horizontal')">
横
</button>

</div>

</div>

<div id="paper"></div>

<script>

const writeBtn=document.getElementById("writeBtn");
const menu=document.getElementById("paperMenu");
const home=document.getElementById("home");
const paper=document.getElementById("paper");

writeBtn.onclick=()=>{

menu.style.display="flex";

}

function createPaper(type){

menu.style.display="none";

home.style.display="none";

paper.style.display="block";

paper.className="";
paper.classList.add(type);

// 紙の中身
paper.innerHTML=`
<div id="toolbar">

<select id="paperColor">
<option value="white">白</option>
<option value="#fff7b2">黄色</option>
<option value="#ffd6ea">ピンク</option>
<option value="#d7f6ff">水色</option>
<option value="#d8ffd8">黄緑</option>
<option value="#222">黒</option>
</select>

</div>

<canvas id="canvas"></canvas>
`;

const canvas=document.getElementById("canvas");
canvas.width=paper.clientWidth;
canvas.height=paper.clientHeight-45;

const ctx=canvas.getContext("2d");

ctx.lineWidth=4;
ctx.lineCap="round";

let drawing=false;

function pos(e){

const r=canvas.getBoundingClientRect();

if(e.touches){

return{
x:e.touches[0].clientX-r.left,
y:e.touches[0].clientY-r.top
}

}

return{
x:e.clientX-r.left,
y:e.clientY-r.top
}

}

function start(e){

drawing=true;

const p=pos(e);

ctx.beginPath();
ctx.moveTo(p.x,p.y);

}

function move(e){

if(!drawing)return;

e.preventDefault();

const p=pos(e);

ctx.lineTo(p.x,p.y);

ctx.stroke();

}

function end(){

drawing=false;

}

canvas.addEventListener("mousedown",start);
canvas.addEventListener("mousemove",move);
canvas.addEventListener("mouseup",end);

canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchmove",move,{passive:false});
canvas.addEventListener("touchend",end);

document.getElementById("paperColor").onchange=function(){

paper.style.background=this.value;

}
}
#toolbar{
height:45px;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid #ccc;
background:#f5f5f5;
}

#toolbar select{
font-size:18px;
padding:5px;
}

#canvas{
display:block;
touch-action:none;
}
