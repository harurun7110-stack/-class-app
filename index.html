<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{font-family:sans-serif;margin:0;}

#topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#eee;
}

#home{display:none;}

button{margin:5px;padding:10px;}

.red{background:red;color:white;}
.blue{background:blue;color:white;}
.green{background:green;color:white;}

.shopGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:10px;
}

.item{
  border:1px solid #ccc;
  padding:10px;
}

#menu{
  position:absolute;
  right:10px;
  top:50px;
  background:white;
  border:1px solid #ccc;
  display:none;
}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
<h2>登録 / ログイン</h2>

<input id="name" placeholder="名前"><br>
<input id="password" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="login()">ログイン</button>

<p id="msg"></p>
</div>

<!-- ホーム -->
<div id="home">

<div id="topbar">
<div id="user"></div>
<div>ポイント: <span id="points">0</span></div>
</div>

<button class="red" onclick="openShop()">ショップ</button>
<button class="blue" onclick="showPoint()">ポイント</button>
<button class="green" onclick="admin()">管理者</button>

<div id="content"></div>
</div>

<script>

// ===== Firebase =====
const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR.firebaseapp.com",
  projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = null;
let products = [];
let myPoints = 0;
let successMsg = "購入しました";

// ===== 登録（100pt付与）=====
function register(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("password").value;

  if(!name||!pass){
    msg.innerText="入力して";
    return;
  }

  currentUser = name;

  db.collection("users").doc(name).set({
    pass: pass,
    points: 100
  });

  msg.innerText="登録完了 +100pt";
}

// ===== ログイン =====
function login(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("password").value;

  db.collection("users").doc(name).get().then(doc=>{
    if(!doc.exists){
      alert("なし");
      return;
    }

    const data = doc.data();

    if(pass !== data.pass){
      alert("失敗");
      return;
    }

    currentUser = name;
    myPoints = data.points;

    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";
    document.getElementById("user").innerText=name;

    document.getElementById("points").innerText=myPoints;

    loadProducts();
  });
}

// ===== ポイント表示（右上）=====
function updatePoints(){
  document.getElementById("points").innerText=myPoints;
}

// ===== ショップ読み込み =====
function loadProducts(){
  db.collection("products").onSnapshot(snap=>{
    products=[];
    snap.forEach(d=>{
      products.push({id:d.id,...d.data()});
    });
    openShop();
  });
}

// ===== ショップ =====
function openShop(){
  let html="<h3>ショップ</h3><div class='shopGrid'>";

  products.forEach(p=>{
    html+=`
    <div class="item">
      <img src="${p.img}" width="100"><br>
      ${p.name}<br>
      ${p.price}pt<br>
      <button onclick="buy('${p.id}',${p.price})">購入</button>
    </div>`;
  });

  html+="</div><button onclick='addProduct()'>追加(管理者)</button>";

  content.innerHTML=html;
}

// ===== 購入 =====
function buy(id,price){

  if(myPoints < price){
    alert("ポイント不足で買えません");
    return;
  }

  const ok = confirm("購入しますか？");
  if(!ok) return;

  // 管理者メッセージ取得
  db.collection("settings").doc("main").get().then(doc=>{
    if(doc.exists){
      successMsg = doc.data().msg;
    }

    alert(successMsg);

    db.collection("products").doc(id).delete();
  });
}

// ===== 管理者追加 =====
function addProduct(){
  const code = prompt("コード");
  if(code!=="582854") return;

  const name = prompt("商品名");
  const price = prompt("値段");
  const img = prompt("画像URL");

  db.collection("products").add({name,price,img});
}

// ===== 管理者設定 =====
function admin(){
  const code = prompt("コード");

  if(code==="582854"){
    const msg = prompt("購入成功メッセージ");

    db.collection("settings").doc("main").set({
      msg: msg || "購入しました"
    });

    alert("設定完了");
  }
}

// ===== ポイント表示 =====
function showPoint(){
  alert("ポイント: "+myPoints);
}

</script>

</body>
</html>
