<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>オンラインショップ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}
.box{border:1px solid #ccc;margin:5px;padding:10px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}
button{margin:5px;}
</style>
</head>

<body>

<h2>オンラインショップ</h2>

<div id="login">
<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>
<button onclick="login()">ログイン</button>
</div>

<div id="home" style="display:none">

<h3 id="user"></h3>
<div>ポイント: <span id="points">0</span></div>

<button onclick="openShop()">ショップ</button>
<button onclick="useCode()">コード入力</button>
<button onclick="adminPanel()">管理者</button>
<button onclick="showRank()">ランキング</button>

<div id="shop"></div>
<div id="rank"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  doc,
  setDoc,
  getDoc,
  updateDoc,
  getDocs,
  collection
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "YOUR_KEY",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let currentUser = null;
let isAdmin = false;

// ===== 商品（共有）=====
let items = [
  {name:"かのあのTiktok", price:50, message:"k514915"},
  {name:"板谷りんかのTiktok", price:40, message:"rinka75431"},
  {name:"あやののTiktok", price:40, message:"taaaaaaaiyakl"},
  {name:"ねねのTiktok", price:40, message:"n4_e2ne1"},
  {name:"亀谷りなが告った人", price:60, message:"豊田こうすけ、振られた"}
];

// ===== ログイン =====
window.login = async function(){

  let name = document.getElementById("name").value;
  let pass = document.getElementById("pass").value;

  let ref = doc(db,"users",name);
  let snap = await getDoc(ref);

  if(!snap.exists()){
    await setDoc(ref,{pass,points:100});
  }

  let data = (await getDoc(ref)).data();

  if(data.pass !== pass){
    return alert("失敗");
  }

  currentUser = name;

  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";

  loadPoints();
  renderShop();
}

// ===== ポイント =====
async function loadPoints(){

  let snap = await getDoc(doc(db,"users",currentUser));

  document.getElementById("points").innerText =
    snap.data().points;
}

// ===== ショップ =====
window.openShop = function(){
  renderShop();
}

function renderShop(){

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">
      <b>${item.name}</b><br>
      ${item.price}pt<br>
      <button onclick="buy(${i})">購入</button>
    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 購入 =====
window.buy = async function(i){

  let ref = doc(db,"users",currentUser);
  let snap = await getDoc(ref);
  let user = snap.data();

  let item = items[i];

  if(user.points < item.price){
    return alert("ポイント不足");
  }

  user.points -= item.price;

  await updateDoc(ref,{points:user.points});

  loadPoints();

  alert(item.name + "\n\n" + item.message);
}

// ===== コード =====
window.useCode = async function(){

  let code = prompt("コード");

  let ref = doc(db,"codes",code);
  let snap = await getDoc(ref);

  if(!snap.exists() || snap.data().used){
    return alert("無効");
  }

  await updateDoc(ref,{used:true});

  let userRef = doc(db,"users",currentUser);
  let userSnap = await getDoc(userRef);

  let u = userSnap.data();

  u.points += 100;

  await updateDoc(userRef,{points:u.points});

  loadPoints();

  alert("100ポイント！");
}

// ===== 管理者パネル =====
window.adminPanel = async function(){

  let code = prompt("管理者コード");

  if(code !== "582854") return;

  isAdmin = true;

  let snap = await getDocs(collection(db,"codes"));

  let list = "";

  snap.forEach(c=>{
    list += c.id + " / " + (c.data().used ? "使用済み" : "未使用") + "\n";
  });

  alert("コード一覧\n\n" + list);
}

// ===== ランキング =====
window.showRank = async function(){

  let snap = await getDocs(collection(db,"users"));

  let list = [];

  snap.forEach(u=>{
    list.push({
      name:u.id,
      points:u.data().points
    });
  });

  list.sort((a,b)=>b.points-a.points);

  let text="ランキング\n\n";

  list.forEach((u,i)=>{
    text += (i+1)+"位 "+u.name+" "+u.points+"pt\n";
  });

  alert(text);
}

</script>

</body>
</html>
