<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お絵描きアプリ</title>

<style>

body{
  margin:0;
  background:#eee;
  font-family:sans-serif;
  text-align:center;
  overflow:hidden;
}

h1{
  font-size:22px;
}

#tools{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:5px;
}

button{
  padding:8px 12px;
  border:0;
  border-radius:10px;
  background:#4da6ff;
  color:white;
}

canvas{
  background:white;
  border:2px solid black;
  touch-action:none;
}

#area{
  position:relative;
  margin:auto;
  width:350px;
  height:500px;
  transform-origin:center;
}

.item{
  position:absolute;
  user-select:none;
  touch-action:none;
}

</style>
</head>

<body>

<h1>お絵描きアプリ</h1>

<div id="tools">

<button onclick="pen()">ペン</button>
<button onclick="eraser()">消しゴム</button>

<button onclick="colorSet('black')">黒</button>
<button onclick="colorSet('red')">赤</button>
<button onclick="colorSet('blue')">青</button>

<input type="range" id="size" min="1" max="50" value="5">

<button onclick="zoomIn()">ズーム+</button>
<button onclick="zoomOut()">ズーム-</button>
<button onclick="resetZoom()">戻す</button>

<button onclick="addText()">文字</button>
<input type="file" accept="image/*" onchange="addPhoto(event)">

<button onclick="finish()">完成</button>

</div>


<div id="area">

<canvas id="canvas" width="350" height="500"></canvas>

</div>
<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const area=document.getElementById("area");

let drawMode="pen";
let color="black";
let zoom=1;

let drawing=false;


function pen(){
 drawMode="pen";
}

function eraser(){
 drawMode="eraser";
}

function colorSet(c){
 color=c;
}



canvas.addEventListener("touchstart",start);
canvas.addEventListener("touchmove",draw);
canvas.addEventListener("touchend",stop);


function start(e){
 drawing=true;
 draw(e);
}


function stop(){
 drawing=false;
 ctx.beginPath();
}


function draw(e){

 if(!drawing)return;

 let r=canvas.getBoundingClientRect();

 let x=e.touches[0].clientX-r.left;
 let y=e.touches[0].clientY-r.top;


 ctx.lineWidth=document.getElementById("size").value;
 ctx.lineCap="round";


 if(drawMode==="eraser"){
  ctx.strokeStyle="white";
 }else{
  ctx.strokeStyle=color;
 }


 ctx.lineTo(x,y);
 ctx.stroke();

 ctx.beginPath();
 ctx.moveTo(x,y);

 e.preventDefault();

}



function zoomIn(){
 zoom+=0.1;
 area.style.transform=`scale(${zoom})`;
}


function zoomOut(){
 if(zoom>0.5){
  zoom-=0.1;
  area.style.transform=`scale(${zoom})`;
 }
}


function resetZoom(){
 zoom=1;
 area.style.transform="scale(1)";
}



function addText(){

 let t=prompt("文字を入力");

 if(!t)return;


 let div=document.createElement("div");

 div.className="item";
 div.innerText=t;

 div.style.left="50px";
 div.style.top="50px";
 div.style.fontSize="30px";
 div.style.color=color;


 area.appendChild(div);


 moveItem(div);

}



function addPhoto(e){

 let file=e.target.files[0];

 let img=document.createElement("img");

 img.className="item";

 img.src=URL.createObjectURL(file);

 img.style.width="150px";

 img.style.left="50px";
 img.style.top="50px";


 area.appendChild(img);

 moveItem(img);

}



function moveItem(el){

 let move=false;
 let x=0;
 let y=0;


 el.addEventListener("touchstart",e=>{

  move=true;

  x=e.touches[0].clientX-el.offsetLeft;
  y=e.touches[0].clientY-el.offsetTop;

 });


 el.addEventListener("touchmove",e=>{

  if(!move)return;

  el.style.left=
  e.touches[0].clientX-x+"px";

  el.style.top=
  e.touches[0].clientY-y+"px";

 });


 el.addEventListener("touchend",()=>{
  move=false;
 });


}



function finish(){

 let a=document.createElement("a");

 a.download="作品.png";

 a.href=canvas.toDataURL();

 a.click();

}

</script>

</body>
</html>
