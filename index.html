<script>


const canvas = document.getElementById("canvas");

const ctx = canvas.getContext("2d");



let drawing = false;


let tool = "pen";


let color = "#000000";


let size = 8;






// 線の設定

function setup(){

ctx.lineCap="round";

ctx.lineJoin="round";

}





setup();







// 描き始め

function startDraw(e){


drawing=true;


let pos=getPos(e);


ctx.beginPath();


ctx.moveTo(pos.x,pos.y);


}







// 描く

function draw(e){


if(!drawing)return;



let pos=getPos(e);



if(tool==="eraser"){

ctx.strokeStyle="white";

}else{

ctx.strokeStyle=color;

}



ctx.lineWidth=size;


ctx.lineTo(pos.x,pos.y);


ctx.stroke();


}








// 終了

function endDraw(){


drawing=false;


ctx.closePath();


}







// 座標取得

function getPos(e){


let rect=canvas.getBoundingClientRect();



if(e.touches){


return{

x:e.touches[0].clientX-rect.left,

y:e.touches[0].clientY-rect.top

};


}



return{

x:e.clientX-rect.left,

y:e.clientY-rect.top

};



}








// マウス

canvas.addEventListener(
"mousedown",
startDraw
);


canvas.addEventListener(
"mousemove",
draw
);


canvas.addEventListener(
"mouseup",
endDraw
);





// スマホ指

canvas.addEventListener(
"touchstart",
startDraw
);


canvas.addEventListener(
"touchmove",
draw
);


canvas.addEventListener(
"touchend",
endDraw
);






// ツールボタン

let buttons=document.querySelectorAll(".tool");




// ✏️ペン

buttons[0].onclick=function(){

tool="pen";

};




// 🧽消しゴム

buttons[1].onclick=function(){

tool="eraser";

};




// 🎨色

buttons[2].onclick=function(){


let c=prompt(
"色を入力してください (#ff0000など)",
color
);



if(c){

color=c;

tool="pen";

}


};






// 太さ変更（あとで調整用）

document.addEventListener(
"keydown",
function(e){


if(e.key==="ArrowUp"){

size+=2;

}


if(e.key==="ArrowDown"){

size=Math.max(1,size-2);

}


});



</script>

小さく

<script>


let texts=[];


let selectedText=null;




// 文字ボタン

let textOpen=false;


buttons[3].onclick=function(){


if(textOpen){


document.getElementById("textPanel")
.style.display="none";


textOpen=false;


}else{


document.getElementById("textPanel")
.style.display="block";


textOpen=true;


}



};








// 追加

document.getElementById("addText")
.onclick=function(){


let value=
document.getElementById("textInput").value;



if(value==="")return;




texts.push({


text:value,

x:300,

y:200,

size:40


});



drawTexts();



};







function drawTexts(){



// 文字を描画

texts.forEach(function(t){



ctx.font=t.size+"px sans-serif";


ctx.fillStyle="black";


ctx.fillText(

t.text,

t.x,

t.y

);



});



}






// 大きく

document.getElementById("bigText")
.onclick=function(){


if(texts.length){


texts[texts.length-1].size+=5;


drawTexts();


}


};







// 小さく

document.getElementById("smallText")
.onclick=function(){


if(texts.length){


texts[texts.length-1].size-=5;


drawTexts();


}


};




</script>

<script>


let images=[];


let photoOpen=false;




// 写真ボタン

buttons[4].onclick=function(){


if(photoOpen){


photoPanel.style.display="none";


photoOpen=false;


}else{


photoPanel.style.display="block";


photoOpen=true;


}



};







// 写真読み込み

photoInput.onchange=function(e){



let file=e.target.files[0];



if(!file)return;





let reader=new FileReader();





reader.onload=function(){



let img=new Image();



img.onload=function(){



images.push({

img:img,

x:250,

y:150,

w:250,

h:180

});



redraw();


};



img.src=reader.result;



};



reader.readAsDataURL(file);



};








// 全体再描画

function redraw(){



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);




// 写真

images.forEach(function(i){



ctx.drawImage(

i.img,

i.x,

i.y,

i.w,

i.h

);



});




// 文字

texts.forEach(function(t){


ctx.font=t.size+"px sans-serif";


ctx.fillStyle="black";


ctx.fillText(

t.text,

t.x,

t.y

);



});



}



</script>

<script>


let materials=[];


let materialOpen=false;





// 素材ボタン

buttons[5].onclick=function(){


if(materialOpen){


materialPanel.style.display="none";


materialOpen=false;


}else{


materialPanel.style.display="block";


materialOpen=true;


}


};







// ❤️追加

heartStamp.onclick=function(){


materials.push({

type:"heart",

x:350,

y:250,

size:50

});


redraw();


};







// ⭐追加

starStamp.onclick=function(){


materials.push({

type:"star",

x:400,

y:250,

size:50

});


redraw();


};








// ⚪追加

circleShape.onclick=function(){


materials.push({

type:"circle",

x:450,

y:250,

size:60

});


redraw();


};







// 素材描画を追加した再描画

let oldRedraw=redraw;



redraw=function(){



oldRedraw();




materials.forEach(function(m){



ctx.font=m.size+"px sans-serif";



if(m.type==="heart"){


ctx.fillText(

"❤️",

m.x,

m.y

);


}



if(m.type==="star"){


ctx.fillText(

"⭐",

m.x,

m.y

);


}



if(m.type==="circle"){


ctx.beginPath();


ctx.arc(

m.x,

m.y,

m.size/2,

0,

Math.PI*2

);


ctx.fillStyle="skyblue";


ctx.fill();


}



});



};



</script>
<script>


let history=[];

let redoHistory=[];





// 現在の絵を保存

function saveHistory(){


history.push(

canvas.toDataURL()

);


if(history.length>30){


history.shift();


}



redoHistory=[];


}






// 初期保存

saveHistory();







// 描いた後に保存する準備

canvas.addEventListener(

"mouseup",

function(){


saveHistory();


});









// ↩️戻るボタン

buttons[6].onclick=function(){



if(history.length<=1)return;




let now=

history.pop();



redoHistory.push(now);





let img=new Image();



img.onload=function(){



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);



ctx.drawImage(

img,

0,

0

);



};



img.src=

history[history.length-1];



};








// ↪️やり直し

buttons[7].onclick=function(){



if(redoHistory.length===0)return;




let imgData=

redoHistory.pop();



history.push(imgData);




let img=new Image();



img.onload=function(){



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);



ctx.drawImage(

img,

0,

0

);



};



img.src=imgData;



};




</script>

</button>

<script>


let selectedObject=null;


let selectOpen=false;





// 選択ボタン（戻る前提でツール7番）

buttons[5].ondblclick=function(){



if(selectOpen){


selectPanel.style.display="none";


selectOpen=false;



}else{


selectPanel.style.display="block";


selectOpen=true;


}


};







// オブジェクト削除

deleteObject.onclick=function(){



if(selectedObject){



if(texts.includes(selectedObject)){


texts.splice(

texts.indexOf(selectedObject),

1

);


}



if(materials.includes(selectedObject)){


materials.splice(

materials.indexOf(selectedObject),

1

);


}



redraw();



}



};







// コピー

duplicateObject.onclick=function(){



if(selectedObject){



let copy=

JSON.parse(

JSON.stringify(selectedObject)

);



copy.x+=30;

copy.y+=30;



if(texts.includes(selectedObject)){


texts.push(copy);


}



if(materials.includes(selectedObject)){


materials.push(copy);


}



redraw();


}



};




</script>
<style>


body{

touch-action:none;

}



/* ズーム表示 */

#zoomInfo{

position:absolute;

top:65px;

left:15px;

background:#111;

color:white;

padding:8px 12px;

border-radius:12px;

font-size:13px;

}


</style>





<div id="zoomInfo">

🔍 100%

</div>






<script>


let zoom=1;



let zoomInfo=
document.getElementById("zoomInfo");






// ピンチズーム用

let startDistance=null;





canvas.addEventListener(

"touchmove",

function(e){



if(e.touches.length===2){



let a=e.touches[0];

let b=e.touches[1];




let distance=Math.sqrt(

(a.clientX-b.clientX)**2+

(a.clientY-b.clientY)**2

);




if(startDistance){



let diff=

distance-startDistance;



zoom += diff/500;



if(zoom<0.5)zoom=0.5;


if(zoom>3)zoom=3;



canvas.style.transform=

"scale("+zoom+")";



zoomInfo.innerHTML=

"🔍 "+

Math.round(zoom*100)

+"%";



}



startDistance=distance;



}



},

{passive:false}

);






canvas.addEventListener(

"touchend",

function(){


startDistance=null;


});





</script>

<div id="brushPanel">


<h3>🖌 ブラシ</h3>


<button id="normalBrush">

普通

</button>


<button id="markerBrush">

マーカー

</button>


<button id="softBrush">

筆

</button>


</div>






<script>


let brushType="normal";


let brushOpen=false;





// ペンボタン長押しでブラシ設定

buttons[0].oncontextmenu=function(e){

e.preventDefault();


if(brushOpen){


brushPanel.style.display="none";


brushOpen=false;



}else{


brushPanel.style.display="block";


brushOpen=true;


}


};








normalBrush.onclick=function(){


brushType="normal";


size=8;


};





markerBrush.onclick=function(){


brushType="marker";


size=20;


};





softBrush.onclick=function(){


brushType="soft";


size=15;


};







// 描画設定を変更

let oldDraw=draw;



draw=function(e){



if(!drawing)return;



let pos=getPos(e);



if(brushType==="marker"){


ctx.globalAlpha=0.4;


}else{


ctx.globalAlpha=1;


}




if(tool==="eraser"){


ctx.strokeStyle="white";


}else{


ctx.strokeStyle=color;


}




ctx.lineWidth=size;


ctx.lineTo(pos.x,pos.y);


ctx.stroke();



ctx.globalAlpha=1;



};





</script>
