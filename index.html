<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}
#home{display:none;}
button{padding:10px;margin:5px;}
.item{border:1px solid #ccc;margin:5px;padding:10px;}
</style>
</head>

<body>

<div id="login">
<h2>ログイン</h2>

<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>

<button onclick="login()">ログイン</button>
</div>

<div id="home">

<h2 id="user"></h2>

<button onclick="openShop()">ショップ</button>
<button onclick="admin()">管理者</button>

<div id="content"></div>

</div>

<script>

let products = [];

// ===== ログイン =====
function login(){
  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";

  document.getElementById("user").innerText=
    document.getElementById("name").value;
}

// ===== ショップ表示（常に最新）=====
function openShop(){
  renderShop();
}

function renderShop(){
  let html="<h3>ショップ</h3>";

  if(products.length === 0){
    html+="<p>商品なし</p>";
  }

  products.forEach(p=>{
    html+=`
    <div class="item">
      ${p.name}<br>
      ${p.price}円
    </div>
    `;
  });

  html+=`<br><button onclick="addProduct()">商品追加</button>`;

  document.getElementById("content").innerHTML=html;
}

// ===== 商品追加 =====
function addProduct(){
  const name = prompt("商品名");
  const price = prompt("値段");

  products.push({name,price});

  renderShop(); // ←これが超重要
}

// ===== 管理者 =====
function admin(){
  const code = prompt("コード");

  if(code==="582854"){
    const name = prompt("商品名");
    const price = prompt("値段");

    products.push({name,price});

    renderShop(); // ←これが超重要

    alert("追加完了");
  }
}

</script>

</body>
</html>
