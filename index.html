<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<style>
body { font-family: sans-serif; margin:0; text-align:center; }

button{ padding:10px; margin:5px; }

#home{ display:none; }

.red{ background:red; color:white; }
.blue{ background:blue; color:white; }
.green{ background:green; color:white; }

#content{ padding:10px; }
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
<h2>ログイン</h2>

<input id="name" placeholder="名前"><br>
<input id="password" type="password" placeholder="パスワード"><br>

<button onclick="login()">ログイン</button>
<p id="msg"></p>
</div>

<!-- ホーム -->
<div id="home">

<h2 id="user"></h2>

<button class="red" onclick="openShop()">ショップ</button>
<button class="blue" onclick="showPoint()">ポイント</button>
<button class="green" onclick="admin()">管理者</button>

<div id="content"></div>
</div>

<script>

let currentUser = null;
let points = 100;

// ===== 登録（簡易）=====
function register(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("password").value;

  if(!name || !pass){
    msg.innerText = "入力して";
    return;
  }

  localStorage.setItem("user", JSON.stringify({
    name:name,
    pass:pass,
    points:100
  }));

  msg.innerText = "登録完了 +100pt";
}

// ===== ログイン =====
function login(){
  const data = JSON.parse(localStorage.getItem("user"));

  const name = document.getElementById("name").value;
  const pass = document.getElementById("password").value;

  if(!data){
    alert("未登録");
    return;
  }

  if(name === data.name && pass === data.pass){
    currentUser = data;
    points = data.points;

    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";
    document.getElementById("user").innerText=data.name;
  } else {
    alert("失敗");
  }
}

// ===== ショップ =====
function openShop(){
  document.getElementById("content").innerHTML=`
    <h3>ショップ</h3>
    <p>まだ商品なし</p>
  `;
}

// ===== ポイント表示 =====
function showPoint(){
  alert("ポイント: " + points);
}

// ===== 管理者 =====
function admin(){
  const code = prompt("コード");

  if(code==="582854"){
    const msg = prompt("購入成功メッセージ");
    localStorage.setItem("adminMsg", msg);
    alert("設定完了");
  } else {
    alert("違う");
  }
}

</script>

</body>
</html>
