<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クラスアプリ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}

#home{display:none;}

button{padding:10px;margin:5px;}

.red{background:red;color:white;}
.blue{background:blue;color:white;}
.green{background:green;color:white;}
</style>
</head>

<body>

<!-- ログイン画面 -->
<div id="login">
<h2>ログイン / 登録</h2>

<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="login()">ログイン</button>

<p id="msg"></p>
</div>

<!-- ホーム -->
<div id="home">

<h2 id="user"></h2>

<button class="red" onclick="openShop()">ショップ</button>
<button class="blue" onclick="showPoint()">ポイント</button>
<button class="green" onclick="admin()">管理者</button>

<div id="content"></div>

</div>

<script>

// ===== 登録（必ず動く）=====
function register(){
  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  if(!name || !pass){
    document.getElementById("msg").innerText = "入力して";
    return;
  }

  localStorage.setItem("user", JSON.stringify({
    name:name,
    pass:pass,
    points:100
  }));

  document.getElementById("msg").innerText = "登録完了 +100pt";
}

// ===== ログイン =====
function login(){
  const data = JSON.parse(localStorage.getItem("user"));

  const name = document.getElementById("name").value;
  const pass = document.getElementById("pass").value;

  if(!data){
    alert("まだ登録されてない");
    return;
  }

  if(name === data.name && pass === data.pass){

    document.getElementById("login").style.display="none";
    document.getElementById("home").style.display="block";

    document.getElementById("user").innerText = data.name;

  } else {
    alert("ログイン失敗");
  }
}

// ===== ショップ =====
function openShop(){
  content.innerHTML = "<h3>ショップ</h3><p>まだ商品なし</p>";
}

// ===== ポイント =====
function showPoint(){
  alert("ポイント: 100");
}

// ===== 管理者 =====
function admin(){
  const code = prompt("コード");
  if(code==="582854"){
    alert("管理者OK");
  } else {
    alert("違う");
  }
}

</script>

</body>
</html>
