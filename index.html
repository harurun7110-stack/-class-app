<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お絵描きアプリ</title>

<style>

body{
 margin:0;
 background:#eee;
 font-family:sans-serif;
 text-align:center;
}

#tools{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:5px;
}

button{
 padding:8px;
 border:none;
 border-radius:10px;
 background:#4da6ff;
 color:white;
}

#paper{
 width:350px;
 height:500px;
 background:white;
 border:2px solid black;
 margin:10px auto;
 position:relative;
 overflow:hidden;
}

canvas{
 position:absolute;
 left:0;
 top:0;
 width:350px;
 height:500px;
 touch-action:none;
}

.object{
 position:absolute;
 user-select:none;
 touch-action:none;
}

</style>
</head>

<body>

<h1>お絵描きアプリ</h1>

<div id="tools">

<button onclick="togglePen()">ペンON/OFF</button>

<button onclick="setMode('eraser')">消しゴム</button>

<button onclick="setColor('black')">黒</button>
<button onclick="setColor('red')">赤</button>
<button onclick="setColor('blue')">青</button>

<input id="penSize" type="range" min="1" max="40" value="5">

<button onclick="addText()">文字</button>

<input type="file" accept="image/*" onchange="addPhoto(event)">

<button onclick="saveWork()">完成</button>

</div>


<div id="paper">

<canvas id="canvas" width="350" height="500"></canvas>

</div>
<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const paper=document.getElementById("paper");


let mode="none";
let color="black";
let drawing=false;



// ペン

function togglePen(){

 mode = mode==="pen" ? "none" : "pen";

}



function setMode(m){

 mode=m;

}



function setColor(c){

 color=c;

}



canvas.addEventListener("touchstart",function(e){

 if(mode!=="pen" && mode!=="eraser")return;

 drawing=true;

 draw(e);

});



canvas.addEventListener("touchmove",draw);


canvas.addEventListener("touchend",function(){

 drawing=false;

 ctx.beginPath();

});



function draw(e){

 if(!drawing)return;


 let r=canvas.getBoundingClientRect();

 let x=e.touches[0].clientX-r.left;

 let y=e.touches[0].clientY-r.top;


 ctx.lineWidth=document.getElementById("penSize").value;

 ctx.lineCap="round";


 if(mode==="eraser"){

  ctx.strokeStyle="white";

 }else{

  ctx.strokeStyle=color;

 }


 ctx.lineTo(x,y);

 ctx.stroke();


 ctx.beginPath();

 ctx.moveTo(x,y);


 e.preventDefault();

}



// 文字追加

function addText(){

 let text=prompt("文字を入力");


 if(!text)return;


 let div=document.createElement("div");


 div.className="object";


 div.innerText=text;


 div.style.left="20px";

 div.style.top="20px";

 div.style.fontSize="30px";

 div.style.color=color;


 paper.appendChild(div);


 controlText(div);

}
 function controlText(el){

 let moving=false;

 let startX=0;
 let startY=0;

 let startLeft=0;
 let startTop=0;


 el.addEventListener("touchstart",function(e){

  moving=true;


  startX=e.touches[0].clientX;
  startY=e.touches[0].clientY;


  startLeft=el.offsetLeft;
  startTop=el.offsetTop;

 });



 el.addEventListener("touchmove",function(e){

  if(!moving)return;


  let x=startLeft+
  e.touches[0].clientX-startX;


  let y=startTop+
  e.touches[0].clientY-startY;



  el.style.left=x+"px";

  el.style.top=y+"px";



  // 端に来た時だけ改行

  if(el.offsetLeft+el.offsetWidth>paper.clientWidth){

   el.style.width=
   (paper.clientWidth-el.offsetLeft)+"px";

   el.style.whiteSpace="normal";

  }



  e.preventDefault();


 });



 el.addEventListener("touchend",function(){

  moving=false;

 });


}



// 写真追加

function addPhoto(e){

 let file=e.target.files[0];

 if(!file)return;


 let img=document.createElement("img");


 img.className="object";


 img.src=URL.createObjectURL(file);


 img.style.width="150px";

 img.style.left="20px";

 img.style.top="20px";


 paper.appendChild(img);

}






// 保存

function saveWork(){

 let a=document.createElement("a");

 a.download="作品.png";

 a.href=canvas.toDataURL();

 a.click();

}


function saveWork(){

 let a=document.createElement("a");

 a.download="作品.png";

 a.href=canvas.toDataURL();

 a.click();

}
</script>

</body>
</html>
