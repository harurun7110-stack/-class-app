<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お絵描きアプリ</title>

<style>

body{
 margin:0;
 background:#eee;
 font-family:sans-serif;
 text-align:center;
}

#tools{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:5px;
}

button{
 padding:8px;
 border:0;
 border-radius:10px;
 background:#4da6ff;
 color:white;
}

#paper{
 width:350px;
 height:500px;
 background:white;
 border:2px solid black;
 margin:10px auto;
 position:relative;
 overflow:hidden;
}

canvas{
 position:absolute;
 left:0;
 top:0;
 width:100%;
 height:100%;
 touch-action:none;
}

.object{
 position:absolute;
 touch-action:none;
 user-select:none;
}

.textBox{
 white-space:normal;
 word-break:break-word;
}

</style>
</head>

<body>

<h1>お絵描きアプリ</h1>

<div id="tools">

<button onclick="togglePen()">ペンON/OFF</button>

<button onclick="setTool('eraser')">消しゴム</button>

<button onclick="setColor('black')">黒</button>
<button onclick="setColor('red')">赤</button>
<button onclick="setColor('blue')">青</button>

<input id="size" type="range" min="1" max="40" value="5">

<button onclick="addText()">文字</button>

<input type="file" accept="image/*" onchange="addPhoto(event)">

<button onclick="zoom(1.1)">画面＋</button>
<button onclick="zoom(0.9)">画面−</button>

<button onclick="resetZoom()">戻す</button>

<button onclick="save()">完成</button>

</div>


<div id="paper">

<canvas id="canvas" width="350" height="500"></canvas>

</div>
<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const paper=document.getElementById("paper");

let tool="none";
let color="black";
let drawing=false;

let pageScale=1;


// ペン

function togglePen(){

 tool=tool==="pen"?"none":"pen";

}


function setTool(t){

 tool=t;

}


function setColor(c){

 color=c;

}



canvas.addEventListener("touchstart",e=>{

 if(tool!=="pen" && tool!=="eraser")return;

 drawing=true;

 draw(e);

});


canvas.addEventListener("touchmove",draw);


canvas.addEventListener("touchend",()=>{

 drawing=false;

 ctx.beginPath();

});



function draw(e){

 if(!drawing)return;


 let r=canvas.getBoundingClientRect();

 let x=e.touches[0].clientX-r.left;

 let y=e.touches[0].clientY-r.top;


 ctx.lineWidth=document.getElementById("size").value;

 ctx.lineCap="round";


 ctx.strokeStyle=
 tool==="eraser"?"white":color;


 ctx.lineTo(x,y);

 ctx.stroke();


 ctx.beginPath();

 ctx.moveTo(x,y);


 e.preventDefault();

}



// 文字

function addText(){

 let text=prompt("文字を入力");

 if(!text)return;


 let div=document.createElement("div");

 div.className="object";


 div.innerText=text;


 div.style.left="20px";
 div.style.top="20px";


 // 最初は改行しない
 div.style.whiteSpace="nowrap";


 div.style.fontSize="30px";

 div.style.color=color;


 paper.appendChild(div);


 controlObject(div);

}
 // 写真

function addPhoto(e){

 let file=e.target.files[0];

 if(!file)return;


 let img=document.createElement("img");

 img.className="object";


 img.src=URL.createObjectURL(file);


 img.style.width="150px";

 img.style.left="20px";

 img.style.top="20px";


 paper.appendChild(img);


 controlObject(img);

}




// 文字・写真の操作

function controlObject(el){

 let fixed=false;
 let timer;

 let startX,startY;
 let startLeft,startTop;

 let startDistance=0;
 let scale=1;



 el.addEventListener("touchstart",e=>{

  timer=setTimeout(()=>{

   fixed=!fixed;
   el.style.opacity=fixed?"0.5":"1";

  },700);


  if(e.touches.length===1){

   startX=e.touches[0].clientX;
   startY=e.touches[0].clientY;

   startLeft=el.offsetLeft;
   startTop=el.offsetTop;

  }


  if(e.touches.length===2){

   startDistance=getDistance(e.touches);

  }

 });



 el.addEventListener("touchmove",e=>{


  if(fixed)return;


  clearTimeout(timer);



  // 移動

  if(e.touches.length===1){


   let x=startLeft+
   e.touches[0].clientX-startX;


   let y=startTop+
   e.touches[0].clientY-startY;



   // 左右だけ制限
   x=Math.max(0,x);


   // 下にはみ出さない
   y=Math.max(0,y);



   el.style.left=x+"px";
   el.style.top=y+"px";



   // ★文字だけ端で改行

   if(el.tagName==="DIV"){

    let right=
    el.offsetLeft+el.offsetWidth;


    if(right>paper.clientWidth){

     el.style.whiteSpace="normal";

     el.style.width=
     (paper.clientWidth-el.offsetLeft)+"px";

    }

   }


  }




  // 拡大縮小

  if(e.touches.length===2){

   let now=getDistance(e.touches);


   scale*=now/startDistance;


   if(scale<0.3)scale=0.3;

   if(scale>4)scale=4;


   el.style.transform=
   "scale("+scale+")";


   startDistance=now;

  }


  e.preventDefault();

 });



 el.addEventListener("touchend",()=>{

  clearTimeout(timer);

 });


}

 let fixed=false;

 let timer;


 let startX,startY;

 let startLeft,startTop;


 let startDistance=0;

 let scale=1;



 el.addEventListener("touchstart",e=>{


  timer=setTimeout(()=>{

   fixed=!fixed;

   el.style.opacity=fixed?"0.5":"1";

  },700);



  if(e.touches.length===1){

   startX=e.touches[0].clientX;

   startY=e.touches[0].clientY;


   startLeft=el.offsetLeft;

   startTop=el.offsetTop;

  }


  if(e.touches.length===2){

   startDistance=getDistance(e.touches);

  }


 });



 el.addEventListener("touchmove",e=>{


  if(fixed)return;


  clearTimeout(timer);



  if(e.touches.length===1){


   let x=startLeft+
   e.touches[0].clientX-startX;


   let y=startTop+
   e.touches[0].clientY-startY;



   // 紙の外に出ない

   x=Math.max(0,
   Math.min(x,paper.clientWidth-el.offsetWidth));


   y=Math.max(0,
   Math.min(y,paper.clientHeight-el.offsetHeight));



   el.style.left=x+"px";

   el.style.top=y+"px";



  }



  // 大きさ変更

  if(e.touches.length===2){


   let now=getDistance(e.touches);


   scale*=now/startDistance;


   if(scale<0.3)scale=0.3;

   if(scale>4)scale=4;


   el.style.transform=
   "scale("+scale+")";


   startDistance=now;


  }


  e.preventDefault();

 });


 el.addEventListener("touchend",()=>{

  clearTimeout(timer);

 });


}





function getDistance(t){

 let x=t[0].clientX-t[1].clientX;

 let y=t[0].clientY-t[1].clientY;


 return Math.sqrt(x*x+y*y);

}



// 画面ズーム

function zoom(v){

 pageScale*=v;


 if(pageScale<0.5)pageScale=0.5;

 if(pageScale>3)pageScale=3;


 paper.style.transform=
 "scale("+pageScale+")";

}



function resetZoom(){

 pageScale=1;

 paper.style.transform="scale(1)";

}



// 保存

function save(){

 let a=document.createElement("a");

 a.download="作品.png";

 a.href=canvas.toDataURL();

 a.click();

}


</script>

</body>
</html>
