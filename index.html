<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>完全アプリ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}
#home{display:none;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}
.box{border:1px solid #ccc;padding:10px;}
button{margin:5px;}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
<h2>登録 / ログイン</h2>

<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="login()">ログイン</button>
</div>

<!-- ホーム -->
<div id="home">

<h3 id="user"></h3>

<div>ポイント: <span id="points">0</span></div>

<button onclick="useCode()">コード入力</button>
<button onclick="admin()">管理者</button>
<button onclick="showCodes()">コード一覧（管理者）</button>

<div class="grid" id="shop"></div>

</div>

<script>

// ===== 保存データ =====
let users = JSON.parse(localStorage.getItem("users") || "{}");
let codes = JSON.parse(localStorage.getItem("codes") || "[]");

let currentUser = null;
let isAdmin = false;

// ===== 商品（そのまま）=====
let items = [
  {name:"かのあのTiktok", price:50, message:"k514915"},
  {name:"板谷りんかのTiktok", price:40, message:"rinka75431"},
  {name:"あやののTiktok", price:40, message:"taaaaaaaiyakl"},
  {name:"ねねのTiktok", price:40, message:"n4_e2ne1"},
  {name:"亀谷りなが告った人", price:60, message:"豊田こうすけ、振られた"},
  {name:"吉本先生の黒歴史", price:60, message:"まこが下着の時に吉本が入ってきてまこの下着をガン見した"},
  {name:"寺田かのんの元すきぴ", price:50, message:"井上はるひと柴野蒼太"},
  {name:"ゆらの元好きな人", price:30, message:"かいつくる"},
  {name:"おんかつの好きな人", price:40, message:"りの"},
  {name:"荻野の好きな人集", price:5, message:"柴野蒼太、うた、つくる、小郷"}, 
  {name:"荻野が告った人", price:5, message:"西村あき振られた"},
  {name:"大熊の元好きな人", price:50, message:"かいつくる、柴野蒼太"},
  {name:"宮本が好きな人", price:30, message:"石井ねね"},
  {name:"山根ゆらの好きな人", price:40, message:"yura0102y"},
  {name:"かのんのTikTok", price:20, message:"user20549418622953"} 
];

// ===== 保存 =====
function save(){
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("codes", JSON.stringify(codes));
}

// ===== 登録 =====
function register(){

  let name = document.getElementById("name").value;
  let pass = document.getElementById("pass").value;

  if(!name || !pass){
    return alert("入力して");
  }

  users[name] = {
    pass: pass,
    points: 100
  };

  save();

  alert("登録完了（100ポイント）");
}

// ===== ログイン =====
function login(){

  let name = document.getElementById("name").value;
  let pass = document.getElementById("pass").value;

  if(!users[name]){
    return alert("ユーザーなし");
  }

  if(users[name].pass !== pass){
    return alert("パスワード違う");
  }

  currentUser = name;

  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";

  render();
}

// ===== 表示 =====
function render(){

  document.getElementById("user").innerText = currentUser;
  document.getElementById("points").innerText = users[currentUser].points;

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">
      <b>${item.name}</b><br>
      ${item.price}pt<br>
      <button onclick="buy(${i})">購入</button>
    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 購入 =====
function buy(i){

  let item = items[i];
  let user = users[currentUser];

  if(user.points < item.price){
    return alert("ポイント不足");
  }

  user.points -= item.price;

  save();
  render();

  alert(item.name + "\n\n" + item.message);
}

// ===== 管理者 =====
function admin(){

  let code = prompt("管理者コード");

  if(code === "582854"){
    isAdmin = true;

    generateCodes();

    alert("管理者ON（コード100個生成）");
  }
}

// ===== コード100個生成 =====
function generateCodes(){

  codes = [];

  for(let i=0;i<100;i++){
    let c = Math.random().toString(36).substring(2,8);
    codes.push({code:c, used:false});
  }

  save();
}

// ===== コード使用 =====
function useCode(){

  let input = prompt("コード入力");

  let c = codes.find(x => x.code === input);

  if(!c){
    return alert("無効コード");
  }

  if(c.used){
    return alert("使用済み");
  }

  c.used = true;

  users[currentUser].points += 100;

  save();

  render();

  alert("100ポイント獲得！");
}

// ===== 管理者だけコード見れる =====
function showCodes(){

  if(!isAdmin){
    return alert("管理者じゃない");
  }

  let text="コード一覧\n\n";

  codes.forEach(c=>{
    text += c.code + " / " + (c.used ? "使用済み" : "未使用") + "\n";
  });

  alert(text);
}

</script>

</body>
</html>
