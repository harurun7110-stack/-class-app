<div id="penMenu">


<h3>✏️ペン設定</h3>


色

<input type="color" id="penColor" value="#000000">

太さ

<input type="range" id="penSize" min="1" max="80" value="8">


<br><br>


透明度

<input type="range" id="penAlpha" min="10" max="100" value="100">

普通ペン

マーカー

<button id="pencilBrush">

鉛筆

<script>


const canvas =
document.getElementById("canvas");


const ctx =
canvas.getContext("2d");



let drawing=false;


let mode="pen";


let penColor="#000000";


let penSize=8;


let alpha=1;


let brush="normal";






function position(e){


let r=canvas.getBoundingClientRect();


if(e.touches){

return{

x:e.touches[0].clientX-r.left,

y:e.touches[0].clientY-r.top

};

}


return{

x:e.clientX-r.left,

y:e.clientY-r.top

};


}







function start(e){


drawing=true;


let p=position(e);


ctx.beginPath();


ctx.moveTo(p.x,p.y);


}






function move(e){


if(!drawing)return;



let p=position(e);



ctx.globalAlpha=alpha;



if(mode==="eraser"){


ctx.strokeStyle="white";


}else{


ctx.strokeStyle=penColor;


}




ctx.lineWidth=penSize;


ctx.lineCap="round";



if(brush==="marker"){

ctx.globalAlpha=0.4;

}



if(brush==="pencil"){

ctx.lineWidth=2;

}




ctx.lineTo(p.x,p.y);


ctx.stroke();



}





function end(){


drawing=false;


ctx.globalAlpha=1;


}






canvas.addEventListener("mousedown",start);

canvas.addEventListener("mousemove",move);

canvas.addEventListener("mouseup",end);



canvas.addEventListener("touchstart",start);

canvas.addEventListener("touchmove",move);

canvas.addEventListener("touchend",end);







let tools=
document.querySelectorAll(".tool");







// ペン

tools[0].onclick=function(){



penMenu.style.display=

penMenu.style.display==="block"

?"none"

:"block";



mode="pen";


};






// 消しゴム

tools[1].onclick=function(){


mode="eraser";


};






// 色

penColor.oninput=function(){


penColor=this.value;


};







// 太さ

document.getElementById("penSize")
.oninput=function(){


penSize=this.value;


};






// 透明度

document.getElementById("penAlpha")
.oninput=function(){


alpha=this.value/100;


};






normalBrush.onclick=function(){


brush="normal";


};



markerBrush.onclick=function(){


brush="marker";


};



pencilBrush.onclick=function(){


brush="pencil";


};



</script>

レイヤーとは？<br>
絵を重ねて管理する機能です。<br>
上のレイヤーほど前に表示されます。


</div>

<script>


let layers=[

{

name:"背景",

visible:true

},

{

name:"レイヤー1",

visible:true

}

];



let currentLayer=1;




function updateLayers(){



let box=
document.getElementById("layers");



box.innerHTML="<h3>🗂レイヤー</h3>";




layers.forEach(function(l,i){



let div=document.createElement("div");



div.className="layer";



div.innerHTML=

(l.visible?"👁 ":"🚫 ")

+l.name;



div.onclick=function(){


currentLayer=i;


};



box.appendChild(div);



});



}







// レイヤー表示

document.querySelector("#top button:nth-child(2)")
.onclick=function(){



layerMenu.style.display=

layerMenu.style.display==="block"

?"none"

:"block";


};







// 追加

addLayer.onclick=function(){



layers.push({

name:"レイヤー"+layers.length,

visible:true

});



updateLayers();


};






// 削除

deleteLayer.onclick=function(){



if(layers.length>1){



layers.splice(currentLayer,1);


currentLayer=0;


updateLayers();


}



};







// 表示切替

hideLayer.onclick=function(){


layers[currentLayer].visible=

!layers[currentLayer].visible;


updateLayers();



};







// 上へ

upLayer.onclick=function(){


if(currentLayer<layers.length-1){



let a=layers[currentLayer];


layers[currentLayer]=layers[currentLayer+1];


layers[currentLayer+1]=a;



currentLayer++;


updateLayers();


}



};






// 下へ

downLayer.onclick=function(){



if(currentLayer>0){



let a=layers[currentLayer];


layers[currentLayer]=layers[currentLayer-1];


layers[currentLayer-1]=a;



currentLayer--;


updateLayers();


}



};



</script>

<script>


let textObjects=[];


let selectedText=null;


let textOpen=false;





// 文字ボタン

tools[3].onclick=function(){


textOpen=!textOpen;



textMenu.style.display=

textOpen?"block":"none";


};






// 追加

addText.onclick=function(){



let value=textValue.value;



if(!value)return;




textObjects.push({

text:value,

x:300,

y:250,

size:40,

color:"#000",

angle:0

});



redrawAll();


};






// 描画に文字追加

function drawTexts(){



textObjects.forEach(function(t){



ctx.save();



ctx.translate(t.x,t.y);



ctx.rotate(t.angle);



ctx.font=t.size+"px sans-serif";


ctx.fillStyle=t.color;



ctx.fillText(

t.text,

0,

0

);



ctx.restore();



});



}





// 文字サイズ

textBig.onclick=function(){


if(selectedText){


selectedText.size+=5;


redrawAll();


}


};





textSmall.onclick=function(){



if(selectedText){


selectedText.size=Math.max(

10,

selectedText.size-5

);


redrawAll();


}



};







// 色

textColor.oninput=function(){



if(selectedText){



selectedText.color=this.value;


redrawAll();


}


};







// 削除

removeText.onclick=function(){


if(selectedText){



textObjects.splice(

textObjects.indexOf(selectedText),

1

);



selectedText=null;



redrawAll();


}


};







// 選択

canvas.addEventListener(

"click",

function(e){



let x=e.offsetX;


let y=e.offsetY;



textObjects.forEach(function(t){



if(

x>t.x-20 &&

x<t.x+200 &&

y>t.y-t.size &&

y<t.y+20

){



selectedText=t;


}



});



});





</script>

↔反転

🗑削除

<script>


let photos=[];


let selectedPhoto=null;


let photoOpen=false;






// 写真ボタン

tools[4].onclick=function(){



photoOpen=!photoOpen;



photoMenu.style.display=

photoOpen?"block":"none";



};








// 追加

photoFile.onchange=function(e){



let file=e.target.files[0];


if(!file)return;



let reader=new FileReader();




reader.onload=function(){



let img=new Image();



img.onload=function(){



photos.push({


img:img,

x:200,

y:150,

w:250,

h:180,

angle:0,

flipX:1,

flipY:1


});



redrawAll();


};



img.src=reader.result;


};



reader.readAsDataURL(file);



};









// 写真描画

function drawPhotos(){



photos.forEach(function(p){



ctx.save();



ctx.translate(

p.x+p.w/2,

p.y+p.h/2

);



ctx.rotate(p.angle);



ctx.scale(

p.flipX,

p.flipY

);



ctx.drawImage(

p.img,

-p.w/2,

-p.h/2,

p.w,

p.h

);



ctx.restore();



});



}








// サイズ

photoBig.onclick=function(){


if(selectedPhoto){


selectedPhoto.w+=20;


selectedPhoto.h+=20;


redrawAll();


}


};






photoSmall.onclick=function(){


if(selectedPhoto){


selectedPhoto.w-=20;


selectedPhoto.h-=20;


redrawAll();


}


};







// 回転

rotatePhoto.onclick=function(){


if(selectedPhoto){


selectedPhoto.angle+=0.2;


redrawAll();


}



};






// 左右反転

flipX.onclick=function(){



if(selectedPhoto){


selectedPhoto.flipX*= -1;


redrawAll();


}


};







// 上下反転

flipY.onclick=function(){


if(selectedPhoto){


selectedPhoto.flipY*= -1;


redrawAll();


}


};







// 削除

deletePhoto.onclick=function(){



if(selectedPhoto){


photos.splice(

photos.indexOf(selectedPhoto),

1

);


selectedPhoto=null;


redrawAll();


}



};





</script>

let materials=[];

let materialOpen=false;





// 素材ボタン

tools[5].onclick=function(){


materialOpen=!materialOpen;

materialOpen?"block":"none";

function addMaterial(type){



materials.push({


type:type,

x:350,

y:250,

size:60,

angle:0


});



redrawAll();


}







addHeart.onclick=function(){

addMaterial("❤️");

};


addStar.onclick=function(){

addMaterial("⭐");

};


addCircle.onclick=function(){

addMaterial("circle");

};


addSquare.onclick=function(){

addMaterial("square");

};








function drawMaterials(){



materials.forEach(function(m){



ctx.save();



ctx.translate(

m.x,

m.y

);



ctx.rotate(m.angle);




if(

m.type==="circle"

){


ctx.beginPath();


ctx.fillStyle="skyblue";


ctx.arc(

0,

0,

m.size/2,

0,

Math.PI*2

);


ctx.fill();



}

else if(

m.type==="square"

){



ctx.fillStyle="orange";


ctx.fillRect(

-m.size/2,

-m.size/2,

m.size,

m.size

);



}

else{


ctx.font=m.size+"px sans-serif";


ctx.fillText(

m.type,

-m.size/2,

m.size/2

);



}




ctx.restore();



});



}









materialBig.onclick=function(){


if(selectedMaterial){


selectedMaterial.size+=10;


redrawAll();


}


};





materialSmall.onclick=function(){



if(selectedMaterial){



selectedMaterial.size=Math.max(

10,

selectedMaterial.size-10

);

}


};






materialRotate.onclick=function(){



if(selectedMaterial){



selectedMaterial.angle+=0.2;


redrawAll();


}



};







deleteMaterial.onclick=function(){


if(selectedMaterial){



materials.splice(

materials.indexOf(selectedMaterial),

1

);



selectedMaterial=null;


redrawAll();



}


};





</script>

<script>


let history=[];


let redoList=[];


let clipboard=null;






function saveState(){


history.push(canvas.toDataURL());


if(history.length>40){

history.shift();

}


redoList=[];


}






canvas.addEventListener(

"mouseup",

function(){

saveState();

});






// 編集メニュー

let editOpen=false;



// 設定ボタンの横に追加する形

document.getElementById("top")
.children[1]
.children[1]
.onclick=function(){


editOpen=!editOpen;


editMenu.style.display=

editOpen?"block":"none";


};








undo.onclick=function(){



if(history.length<=1)return;



let now=

history.pop();


redoList.push(now);



loadCanvas(

history[history.length-1]

);



};







redo.onclick=function(){



if(redoList.length===0)return;



let data=

redoList.pop();



history.push(data);



loadCanvas(data);



};







function loadCanvas(data){



let img=new Image();



img.onload=function(){



ctx.clearRect(

0,

0,

canvas.width,

canvas.height

);



ctx.drawImage(

img,

0,

0

);



};



img.src=data;



}







// コピー

copyObj.onclick=function(){



if(selectedText){

clipboard={

type:"text",

data:{...selectedText}

};


}



else if(selectedPhoto){



clipboard={

type:"photo",

data:{...selectedPhoto}

};


}



else if(selectedMaterial){



clipboard={

type:"material",

data:{...selectedMaterial}

};


}



};









// 貼り付け

pasteObj.onclick=function(){



if(!clipboard)return;



let copy=

JSON.parse(

JSON.stringify(

clipboard.data

)

);



copy.x+=40;

copy.y+=40;




if(clipboard.type==="text"){


textObjects.push(copy);


}



if(clipboard.type==="material"){


materials.push(copy);


}



if(clipboard.type==="photo"){


photos.push(copy);


}



redrawAll();



};




</script>

<div id="zoomText">

🔍 100%

</div>







<script>


let zoom=1;


let offsetX=0;


let offsetY=0;


let pinchStart=null;





function updateCanvas(){



canvas.style.transform=

"translate("+offsetX+"px,"+offsetY+"px) scale("+zoom+")";



zoomText.innerHTML=

"🔍 "+Math.round(zoom*100)+"%";



}







// ピンチズーム

canvas.addEventListener(

"touchmove",

function(e){



if(e.touches.length===2){



let a=e.touches[0];

let b=e.touches[1];




let distance=Math.hypot(

a.clientX-b.clientX,

a.clientY-b.clientY

);




if(pinchStart){



zoom +=

(distance-pinchStart)/500;



if(zoom<0.5)

zoom=0.5;



if(zoom>4)

zoom=4;



updateCanvas();



}



pinchStart=distance;



}



},

{passive:false}

);







canvas.addEventListener(

"touchend",

function(){



pinchStart=null;


});








// 長押し移動用

let moveCanvas=false;


let lastX=0;


let lastY=0;





canvas.addEventListener(

"pointerdown",

function(e){



if(e.button===1){



moveCanvas=true;


lastX=e.clientX;


lastY=e.clientY;



}


});






canvas.addEventListener(

"pointermove",

function(e){



if(moveCanvas){



offsetX+=e.clientX-lastX;


offsetY+=e.clientY-lastY;



lastX=e.clientX;


lastY=e.clientY;



updateCanvas();


}



});






canvas.addEventListener(

"pointerup",

function(){

<script>


let extraOpen=false;


let extraMode="brush";





// ペン長押しで表示

tools[0].ondblclick=function(){



extraOpen=!extraOpen;



extraMenu.style.display=

extraOpen?"block":"none";



};







// 直線

lineTool.onclick=function(){


extraMode="line";


};






// 塗りつぶし

fillTool.onclick=function(){


extraMode="fill";


};







// やわらか筆

softTool.onclick=function(){


brush="soft";


};







// 直線描画

let lineStart=null;




canvas.addEventListener(

"pointerdown",

function(e){



if(extraMode==="line"){



lineStart=position(e);


}



});






canvas.addEventListener(

"pointerup",

function(e){



if(extraMode==="line" && lineStart){



let end=position(e);



ctx.strokeStyle=penColor;


ctx.lineWidth=penSize;


ctx.globalAlpha=alpha;



ctx.beginPath();


ctx.moveTo(

lineStart.x,

lineStart.y

);


ctx.lineTo(

end.x,

end.y

);


ctx.stroke();



lineStart=null;


ctx.globalAlpha=1;


}



});







// 簡易塗りつぶし

canvas.addEventListener(

"click",

function(e){



if(extraMode==="fill"){



ctx.fillStyle=penColor;


ctx.fillRect(

0,

0,

canvas.width,

canvas.height

);



}



});





</script>
