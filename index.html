<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>お絵描きアプリ</title>

<style>

body{
 margin:0;
 background:#eee;
 font-family:sans-serif;
 text-align:center;
}

#tools{
 display:flex;
 flex-wrap:wrap;
 justify-content:center;
 gap:5px;
}

button{
 padding:8px 12px;
 border:0;
 border-radius:10px;
 background:#4da6ff;
 color:white;
}

#paper{
 width:350px;
 height:500px;
 background:white;
 border:2px solid black;
 margin:10px auto;
 position:relative;
 overflow:hidden;
 transform-origin:center;
}

canvas{
 position:absolute;
 left:0;
 top:0;
 width:100%;
 height:100%;
 touch-action:none;
}

.object{
 position:absolute;
 touch-action:none;
 user-select:none;
}

</style>
</head>

<body>

<h1>お絵描きアプリ</h1>

<div id="tools">

<button onclick="penToggle()">ペンON/OFF</button>

<button onclick="setMode('eraser')">消しゴム</button>

<button onclick="setColor('black')">黒</button>
<button onclick="setColor('red')">赤</button>
<button onclick="setColor('blue')">青</button>

<input type="range" id="penSize" min="1" max="40" value="5">

<button onclick="makeText()">文字</button>

<input type="file" accept="image/*" onchange="makePhoto(event)">

<button onclick="pageZoom(1.1)">画面＋</button>
<button onclick="pageZoom(0.9)">画面−</button>

<button onclick="resetPage()">戻す</button>

<button onclick="saveWork()">完成</button>

</div>


<div id="paper">

<canvas id="canvas" width="350" height="500"></canvas>

</div>
<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const paper=document.getElementById("paper");

let mode="none";
let color="black";
let penOn=false;

let zoom=1;

let drawing=false;



function penToggle(){

 penOn=!penOn;

 mode=penOn?"pen":"none";

}



function setMode(m){

 mode=m;

}



function setColor(c){

 color=c;

}
function controlObject(el){

 let fixed=false;
 let timer;

 let startX,startY;
 let startL,startT;

 let startDist=0;
 let size=1;


 // タップで文字編集
 el.addEventListener("dblclick",()=>{

  if(el.tagName==="DIV"){

   let n=prompt("文字を変更",el.innerText);

   if(n!==null){

    el.innerText=n;

   }

  }

 });



 // 長押しで固定
 el.addEventListener("touchstart",e=>{


  timer=setTimeout(()=>{

   fixed=!fixed;

   el.style.opacity=fixed?"0.5":"1";

  },700);



  if(e.touches.length===1){

   startX=e.touches[0].clientX;
   startY=e.touches[0].clientY;

   startL=el.offsetLeft;
   startT=el.offsetTop;

  }


  if(e.touches.length===2){

   startDist=getDistance(e.touches);

  }


 });



 el.addEventListener("touchmove",e=>{


  if(fixed)return;


  clearTimeout(timer);



  if(e.touches.length===1){

   let x=e.touches[0].clientX-startX;
   let y=e.touches[0].clientY-startY;


   el.style.left=startL+x+"px";
   el.style.top=startT+y+"px";

  }



  if(e.touches.length===2){

   let now=getDistance(e.touches);


   size*=now/startDist;


   if(size<0.3)size=0.3;
   if(size>5)size=5;


   el.style.transform=
   "scale("+size+")";


   startDist=now;

  }



  e.preventDefault();


 });


 el.addEventListener("touchend",()=>{

  clearTimeout(timer);

 });


}



function getDistance(t){

 let x=t[0].clientX-t[1].clientX;

 let y=t[0].clientY-t[1].clientY;

 return Math.sqrt(x*x+y*y);

}



function pageZoom(v){

 zoom*=v;

 if(zoom<0.5)zoom=0.5;

 if(zoom>3)zoom=3;


 paper.style.transform=
 "scale("+zoom+")";

}



function resetPage(){

 zoom=1;

 paper.style.transform="scale(1)";

}



function saveWork(){

 let a=document.createElement("a");

 a.download="作品.png";

 a.href=canvas.toDataURL();

 a.click();

}


</script>

</body>
</html>
