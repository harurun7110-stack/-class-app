// ===== 保存 =====
function save(){
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("codes", JSON.stringify(codes));
}

// ===== 登録 =====
function register(){

  let name = document.getElementById("name").value;
  let pass = document.getElementById("pass").value;

  if(!name || !pass){
    return alert("入力して");
  }

  users[name] = {
    pass: pass,
    points: 100
  };

  save();

  alert("登録完了（100ポイント）");
}

// ===== ログイン =====
function login(){

  let name = document.getElementById("name").value;
  let pass = document.getElementById("pass").value;

  if(!users[name]){
    return alert("ユーザーなし");
  }

  if(users[name].pass !== pass){
    return alert("パスワード違う");
  }

  currentUser = name;

  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";

  render();
}

// ===== 表示 =====
function render(){

  document.getElementById("user").innerText = currentUser;
  document.getElementById("points").innerText = users[currentUser].points;

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">
      <b>${item.name}</b><br>
      ${item.price}pt<br>
      <button onclick="buy(${i})">購入</button>
    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 購入 =====
function buy(i){

  let item = items[i];
  let user = users[currentUser];

  if(user.points < item.price){
    return alert("ポイント不足");
  }

  user.points -= item.price;

  save();
  render();

  alert(item.name + "\n\n" + item.message);
}

// ===== コード使用 =====
function useCode(){

  let input = prompt("コード入力");

  let c = codes.find(x => x.code === input);

  if(!c){
    return alert("無効コード");
  }

  if(c.used){
    return alert("使用済み");
  }

  c.used = true;

  users[currentUser].points += 100;

  save();

  render();

  alert("100ポイント獲得！");
}

// ===== 管理者だけコード見れる =====
function showCodes(){

  if(!isAdmin){
    return alert("管理者じゃない");
  }

  let text="コード一覧\n\n";

  codes.forEach(c=>{
    text += c.code + " / " + (c.used ? "使用済み" : "未使用") + "\n";
  });

  alert(text);
}
