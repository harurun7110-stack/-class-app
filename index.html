<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>完全ショップ</title>

<style>
body{font-family:sans-serif;text-align:center;margin:0;}
#home{display:none;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;}
.box{border:1px solid #ccc;padding:10px;}
button{margin:5px;}
</style>
</head>

<body>

<!-- ログイン -->
<div id="login">
<h2>ログイン / 登録</h2>

<input id="name" placeholder="名前"><br>
<input id="pass" type="password" placeholder="パスワード"><br>

<button onclick="register()">登録</button>
<button onclick="login()">ログイン</button>
</div>

<!-- ホーム -->
<div id="home">

<h3 id="user"></h3>
<div>ポイント: <span id="points">0</span></div>

<button onclick="useCode()">コード入力</button>
<button onclick="showHistory()">履歴</button>

<div class="grid" id="shop"></div>

</div>

<script>

let currentUser = null;

// ===== 保存データ =====
let users = JSON.parse(localStorage.getItem("users") || "{}");
let history = JSON.parse(localStorage.getItem("history") || "[]");

// ===== 商品（固定）=====
let items = [
  {name:"かのあのTiktok", price:50, message:"k514915"},
  {name:"板谷りんかのTiktok", price:40, message:"rinka75431"},
  {name:"あやののTiktok", price:40, message:"taaaaaaaiyakl"},
  {name:"ねねのTiktok", price:40, message:"n4_e2ne1"},
  {name:"亀谷りなが告った人", price:60, message:"豊田こうすけ、振られた"},
  {name:"太田いつきの元と現好きな人", price:50, message:"元山本ひなた現豊田こうすけ"}
];

// ===== コード（固定100個簡略版）=====
let codes = [
"aa1b2c","bb2c3d","cc3d4e","dd4e5f","ee5f6g",
"ff6g7h","gg7h8i","hh8i9j","ii9j0k","jj0k1l"
];

// ===== 保存 =====
function save(){
  localStorage.setItem("users", JSON.stringify(users));
  localStorage.setItem("history", JSON.stringify(history));
}

// ===== 登録 =====
function register(){

  let name = document.getElementById("name").value;
  let pass = document.getElementById("pass").value;

  if(!name || !pass){
    return alert("入力して");
  }

  users[name] = {
    pass: pass,
    points: 100
  };

  save();

  alert("登録完了（100pt付与）");
}

// ===== ログイン =====
function login(){

  let name = document.getElementById("name").value;
  let pass = document.getElementById("pass").value;

  if(!users[name]){
    return alert("ユーザーなし");
  }

  if(users[name].pass !== pass){
    return alert("パスワード違う");
  }

  currentUser = name;

  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";

  render();
}

// ===== 表示 =====
function render(){

  document.getElementById("user").innerText = currentUser;

  document.getElementById("points").innerText =
    users[currentUser].points;

  let html="";

  items.forEach((item,i)=>{

    html+=`
    <div class="box">
      <b>${item.name}</b><br>
      ${item.price}pt<br>
      <button onclick="buy(${i})">購入</button>
    </div>
    `;
  });

  document.getElementById("shop").innerHTML=html;
}

// ===== 購入 =====
function buy(i){

  let item = items[i];
  let user = users[currentUser];

  if(user.points < item.price){
    return alert("ポイント不足");
  }

  user.points -= item.price;

  save();

  render();

  alert(item.name + "\n\n" + item.message);
}

// ===== コード使用 =====
function useCode(){

  let input = prompt("コード");

  if(!codes.includes(input)){
    return alert("無効");
  }

  codes = codes.filter(c => c !== input);

  users[currentUser].points += 100;

  history.push({
    user: currentUser,
    code: input,
    time: new Date().toLocaleString()
  });

  save();

  render();

  alert("100ポイント付与");
}

// ===== 履歴 =====
function showHistory(){

  let text = "履歴\n\n";

  history.forEach(h=>{
    text += `${h.user} / ${h.code} / ${h.time}\n`;
  });

  alert(text);
}

</script>

</body>
</html>
